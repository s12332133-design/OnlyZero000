<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="使用 Open-Meteo 免費天氣資料的智慧天氣預報網頁，預設顯示台北天氣，可切換至您的位置，提供現在天氣、7 天預報與生活建議（帶傘、穿著、運動等）。">
  <title>智慧天氣預報 | ONLY ZERO</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="shortcut icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F2G4LV0CVW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F2G4LV0CVW');
  </script>
  <style>
    :root {
      --blue: #1A3F97;
      --cyan: #61B9DD;
      --yellow: #F4D21F;
      --white: #FFFFFF;
      --bg: #F7F9FC;
      --text: #1A3F97;
      --text-muted: #5A6B8A;
      --card: #FFFFFF;
      --shadow: 0 8px 28px rgba(26, 63, 151, 0.08);
      --radius: 20px;
      --anim-enter: 0.5s;
      --anim-pulse: 1.8s;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Microsoft YaHei UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Scrollbar */
    html {
      scrollbar-width: thin;
      scrollbar-color: var(--blue) rgba(26, 63, 151, 0.08);
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track {
      background: rgba(26, 63, 151, 0.06);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--blue);
      border-radius: 999px;
      border: 2px solid var(--bg);
      min-height: 40px;
    }
    ::-webkit-scrollbar-thumb:hover { background: #15357d; }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
      position: relative;
      z-index: 1;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      padding: 1.1rem 0 1.4rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--blue);
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 0 0 3px rgba(97, 185, 221, 0.25);
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .location-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
    }

    #location-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--blue);
      background: rgba(26, 63, 151, 0.06);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      border: 1.5px solid rgba(26, 63, 151, 0.1);
    }

    button {
      appearance: none;
      border: 1.5px solid rgba(26, 63, 151, 0.18);
      background: rgba(26, 63, 151, 0.06);
      color: var(--blue);
      padding: 0.5rem 1.05rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.2s, box-shadow 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    button:hover {
      background: var(--blue);
      color: var(--white);
      border-color: var(--blue);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(26, 63, 151, 0.2);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    button.primary {
      background: var(--blue);
      color: var(--white);
      border-color: var(--blue);
      box-shadow: 0 4px 14px rgba(26, 63, 151, 0.22);
    }

    button.primary:hover {
      background: #15357d;
      border-color: #15357d;
    }

    .status {
      font-size: 0.82rem;
      color: var(--text-muted);
      min-height: 1.2em;
      margin-bottom: 0.5rem;
    }

    .error {
      color: #dc2626;
      background: rgba(220, 38, 38, 0.08);
      border: 1.5px solid rgba(220, 38, 38, 0.18);
      padding: 0.75rem 1rem;
      border-radius: 14px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }

    /* Cards */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1.5px solid rgba(26, 63, 151, 0.06);
      padding: 1.5rem 1.6rem;
      margin-bottom: 1.4rem;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 12px 36px rgba(26, 63, 151, 0.11);
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.95rem;
      letter-spacing: 0.03em;
      color: var(--blue);
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .section-title::before {
      content: "";
      width: 10px;
      height: 10px;
      background: var(--yellow);
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulseSoft var(--anim-pulse) ease-in-out infinite;
    }

    @keyframes pulseSoft {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.22); opacity: 0.72; }
    }

    /* Current weather */
    .current-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.25rem;
      align-items: center;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s ease-out 0.1s forwards;
    }

    .current-main {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .current-temp {
      font-size: 3.4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--blue);
    }

    .current-desc {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .current-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem 1.15rem;
      margin-top: 0.7rem;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .current-meta span {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
    }

    .current-meta strong {
      color: var(--blue);
      font-weight: 600;
    }

    .current-icon {
      font-size: 4.2rem;
      line-height: 1;
      text-align: center;
    }

    /* Advice */
    .advice-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .advice-item {
      background: rgba(26, 63, 151, 0.04);
      border: 1.5px solid rgba(26, 63, 151, 0.08);
      border-radius: 14px;
      padding: 0.8rem 1rem;
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      font-size: 0.92rem;
      color: var(--text);
      transition: background 0.2s, border-color 0.2s;
    }

    .advice-item:hover {
      background: rgba(26, 63, 151, 0.07);
      border-color: rgba(26, 63, 151, 0.14);
    }

    .advice-item .icon {
      font-size: 1.2rem;
      flex-shrink: 0;
      margin-top: 0.05rem;
    }

    .advice-item.good { border-left: 3px solid #34d399; }
    .advice-item.warn { border-left: 3px solid #fbbf24; }
    .advice-item.rain { border-left: 3px solid #38bdf8; }
    .advice-item.info { border-left: 3px solid var(--cyan); }

    /* Forecast grid */
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
      gap: 0.7rem;
    }

    .day-card {
      background: rgba(26, 63, 151, 0.03);
      border: 1.5px solid rgba(26, 63, 151, 0.08);
      border-radius: 16px;
      padding: 0.95rem 0.75rem;
      text-align: center;
      transition: background 0.25s, border-color 0.25s, transform 0.2s;
    }

    .day-card:hover {
      background: rgba(26, 63, 151, 0.06);
      border-color: rgba(26, 63, 151, 0.16);
      transform: translateY(-2px);
    }

    .day-card.today {
      border-color: rgba(97, 185, 221, 0.5);
      background: rgba(97, 185, 221, 0.08);
      box-shadow: 0 0 0 1px rgba(97, 185, 221, 0.15);
    }

    .day-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 0.15rem;
    }

    .day-date {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .day-icon {
      font-size: 1.7rem;
      margin: 0.2rem 0;
    }

    .day-temps {
      font-size: 0.92rem;
      font-weight: 600;
      margin: 0.3rem 0;
    }

    .day-temps .high { color: #e11d48; }
    .day-temps .low { color: #2563eb; }

    .day-rain {
      font-size: 0.78rem;
      color: #0ea5e9;
      font-weight: 600;
      margin-top: 0.2rem;
    }

    .day-precip {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--text-muted);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(26, 63, 151, 0.12);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      text-align: center;
      padding: 1.2rem 0 0.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      color: var(--cyan);
      text-decoration: underline;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.6rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--blue); }

    /* Mobile */
    @media (max-width: 600px) {
      .current-card {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .current-icon {
        order: -1;
        font-size: 3.4rem;
      }
      .current-temp { font-size: 2.9rem; }
      .current-meta { justify-content: center; }
      .forecast-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .brand h1 { font-size: 1.1rem; }
      .top-bar { gap: 0.7rem; }
      .card { padding: 1.25rem 1.2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .current-card { opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a href="index.html" class="brand" aria-label="回到首頁">
        <span class="brand-logo" aria-hidden="true"></span>
        <div>
          <h1>智慧天氣預報</h1>
          <div class="brand-sub">ONLY ZERO</div>
        </div>
      </a>
      <div class="location-actions">
        <span id="location-name">台北</span>
        <button id="btn-geo" class="primary" type="button">
          📍 使用我的位置
        </button>
      </div>
    </div>

    <div id="error" class="error"></div>
    <div id="status" class="status"></div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      正在載入天氣資料…
    </div>

    <div id="content" style="display: none;">
      <!-- Current -->
      <section class="card current-card" id="current-card">
        <div class="current-main">
          <div class="current-temp"><span id="temp">--</span>°</div>
          <div class="current-desc" id="weather-desc">--</div>
          <div class="current-meta">
            <span>體感 <strong id="feels-like">--</strong>°</span>
            <span>濕度 <strong id="humidity">--</strong>%</span>
            <span>風速 <strong id="wind">--</strong> km/h</span>
            <span>降雨 <strong id="precip-now">--</strong> mm</span>
          </div>
        </div>
        <div class="current-icon" id="weather-icon">🌤️</div>
      </section>

      <!-- Advice -->
      <section class="card">
        <h2 class="section-title">生活建議</h2>
        <div class="advice-list" id="advice-list"></div>
      </section>

      <!-- Forecast -->
      <section class="card">
        <h2 class="section-title">今日與未來 7 天預報</h2>
        <div class="forecast-grid" id="forecast-grid"></div>
      </section>
    </div>

    <footer>
      天氣資料由 <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> 提供 · 僅供參考
      <br>
      <a href="index.html" class="back-link">← 回到 ONLY ZERO 首頁</a>
    </footer>
  </div>

  <script>
    // ========== Config ==========
    const TAIPEI = { lat: 25.0330, lon: 121.5654, name: '台北' };
    const API_BASE = 'https://api.open-meteo.com/v1/forecast';

    // ========== Weather code map (WMO) ==========
    const WEATHER_CODES = {
      0:  { desc: '晴朗', icon: '☀️' },
      1:  { desc: '大致晴朗', icon: '🌤️' },
      2:  { desc: '局部多雲', icon: '⛅' },
      3:  { desc: '陰天', icon: '☁️' },
      45: { desc: '有霧', icon: '🌫️' },
      48: { desc: '霧凇', icon: '🌫️' },
      51: { desc: '微毛毛雨', icon: '🌦️' },
      53: { desc: '毛毛雨', icon: '🌦️' },
      55: { desc: '濃毛毛雨', icon: '🌧️' },
      56: { desc: '凍毛毛雨', icon: '🌧️' },
      57: { desc: '濃凍毛毛雨', icon: '🌧️' },
      61: { desc: '小雨', icon: '🌧️' },
      63: { desc: '中雨', icon: '🌧️' },
      65: { desc: '大雨', icon: '🌧️' },
      66: { desc: '凍雨', icon: '🌧️' },
      67: { desc: '強凍雨', icon: '🌧️' },
      71: { desc: '小雪', icon: '🌨️' },
      73: { desc: '中雪', icon: '🌨️' },
      75: { desc: '大雪', icon: '❄️' },
      77: { desc: '雪粒', icon: '🌨️' },
      80: { desc: '小陣雨', icon: '🌦️' },
      81: { desc: '中陣雨', icon: '🌧️' },
      82: { desc: '強陣雨', icon: '🌧️' },
      85: { desc: '小陣雪', icon: '🌨️' },
      86: { desc: '強陣雪', icon: '❄️' },
      95: { desc: '雷雨', icon: '⛈️' },
      96: { desc: '雷雨夾冰雹', icon: '⛈️' },
      99: { desc: '強雷雨夾冰雹', icon: '⛈️' }
    };

    function getWeatherInfo(code) {
      return WEATHER_CODES[code] || { desc: '未知', icon: '🌡️' };
    }

    // ========== DOM ==========
    const $ = (id) => document.getElementById(id);
    const loadingEl = $('loading');
    const contentEl = $('content');
    const errorEl = $('error');
    const statusEl = $('status');
    const btnGeo = $('btn-geo');

    // ========== Helpers ==========
    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }
    function clearError() {
      errorEl.style.display = 'none';
      errorEl.textContent = '';
    }

    function formatDate(iso) {
      const d = new Date(iso + 'T12:00:00');
      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      return {
        weekday: '週' + weekdays[d.getDay()],
        date: `${d.getMonth() + 1}/${d.getDate()}`
      };
    }

    // ========== Fetch weather ==========
    async function fetchWeather(lat, lon, name) {
      clearError();
      loadingEl.style.display = 'block';
      contentEl.style.display = 'none';
      statusEl.textContent = '';

      const params = new URLSearchParams({
        latitude: lat,
        longitude: lon,
        current: 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,is_day',
        daily: 'weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset',
        timezone: 'auto',
        forecast_days: 8
      });

      try {
        const res = await fetch(`${API_BASE}?${params}`);
        if (!res.ok) throw new Error(`API 錯誤：${res.status}`);
        const data = await res.json();
        renderWeather(data, name);
      } catch (err) {
        showError('無法取得天氣資料，請稍後再試。' + (err.message ? ` (${err.message})` : ''));
        loadingEl.style.display = 'none';
      }
    }

    // ========== Render ==========
    function renderWeather(data, name) {
      const cur = data.current;
      const daily = data.daily;
      const info = getWeatherInfo(cur.weather_code);

      $('location-name').textContent = name;
      $('temp').textContent = Math.round(cur.temperature_2m);
      $('weather-desc').textContent = info.desc;
      $('weather-icon').textContent = info.icon;
      $('feels-like').textContent = Math.round(cur.apparent_temperature);
      $('humidity').textContent = cur.relative_humidity_2m;
      $('wind').textContent = Math.round(cur.wind_speed_10m);
      $('precip-now').textContent = cur.precipitation.toFixed(1);

      renderAdvice(cur, daily);
      renderForecast(daily);

      loadingEl.style.display = 'none';
      contentEl.style.display = 'block';
    }

    function renderAdvice(cur, daily) {
      const list = $('advice-list');
      list.innerHTML = '';

      const temp = cur.temperature_2m;
      const feels = cur.apparent_temperature;
      const humidity = cur.relative_humidity_2m;
      const wind = cur.wind_speed_10m;
      const precip = cur.precipitation;
      const code = cur.weather_code;

      const todayProb = daily.precipitation_probability_max[0] || 0;
      const todayPrecip = daily.precipitation_sum[0] || 0;
      const todayMax = daily.temperature_2m_max[0];
      const todayMin = daily.temperature_2m_min[0];
      const tempDiff = todayMax - todayMin;
      const maxWind = daily.wind_speed_10m_max[0] || wind;

      const items = [];

      // Rain / umbrella
      if (todayProb >= 50 || todayPrecip >= 1 || precip > 0.2) {
        items.push({
          type: 'rain',
          icon: '☂️',
          text: `今日降雨機率約 ${todayProb}%${todayPrecip > 0 ? `，預計降雨量 ${todayPrecip.toFixed(1)} mm` : ''}，建議隨身攜帶雨傘。`
        });
        if (todayProb >= 70 || todayPrecip >= 5 || [61,63,65,80,81,82,95,96,99].includes(code)) {
          items.push({
            type: 'rain',
            icon: '🧥',
            text: '雨勢可能較大，建議穿防水外套或雨衣，並考慮防水鞋。'
          });
        }
      } else if (todayProb >= 30) {
        items.push({
          type: 'info',
          icon: '🌂',
          text: `今日有小雨機會（約 ${todayProb}%），出門可帶把摺疊傘以防萬一。`
        });
      } else {
        items.push({
          type: 'good',
          icon: '☀️',
          text: '今日降雨機率低，天氣相對穩定，外出較舒適。'
        });
      }

      // Temperature & clothing
      if (tempDiff >= 8) {
        items.push({
          type: 'warn',
          icon: '🧅',
          text: `今日早晚溫差約 ${Math.round(tempDiff)}°C（最高 ${Math.round(todayMax)}° / 最低 ${Math.round(todayMin)}°），建議洋蔥式穿法，方便隨時增減衣物。`
        });
      }

      if (feels <= 15) {
        items.push({
          type: 'info',
          icon: '🧣',
          text: `體感溫度約 ${Math.round(feels)}°C，感覺偏涼，建議多加一件外套或長袖。`
        });
      } else if (feels >= 30) {
        items.push({
          type: 'warn',
          icon: '🥵',
          text: `體感溫度約 ${Math.round(feels)}°C，感覺悶熱，建議穿輕薄透氣衣物，並注意補充水分。`
        });
      } else if (temp >= 22 && temp <= 28) {
        items.push({
          type: 'good',
          icon: '👕',
          text: `目前氣溫舒適（約 ${Math.round(temp)}°C），短袖或薄長袖都適合。`
        });
      }

      // Wind
      if (maxWind >= 30 || wind >= 25) {
        items.push({
          type: 'warn',
          icon: '💨',
          text: `風速較大（目前約 ${Math.round(wind)} km/h，今日最大可達 ${Math.round(maxWind)} km/h），外出時注意固定物品，騎車請減速。`
        });
      } else if (wind >= 15) {
        items.push({
          type: 'info',
          icon: '🌬️',
          text: `有輕微風（約 ${Math.round(wind)} km/h），感覺較涼爽。`
        });
      }

      // Running
      const goodForRun = todayProb < 60 && precip < 1 && temp >= 12 && temp <= 30 && wind < 25 && ![65,82,95,96,99].includes(code);
      if (goodForRun) {
        items.push({
          type: 'good',
          icon: '🏃',
          text: '目前天氣適合戶外跑步或運動，記得做好熱身與補充水分。'
        });
      } else if (todayProb >= 60 || precip > 1 || [65,82,95,96,99].includes(code)) {
        items.push({
          type: 'warn',
          icon: '🏠',
          text: '今日有較高降雨或天氣不佳，建議改為室內運動，或等雨停再出門。'
        });
      } else {
        items.push({
          type: 'info',
          icon: '🏃',
          text: '若要跑步，建議選擇天氣較穩定的時段，並留意路面狀況。'
        });
      }

      // Night out
      const nightMin = todayMin;
      if (todayProb < 40 && nightMin >= 16) {
        items.push({
          type: 'good',
          icon: '🌙',
          text: `今晚天氣尚可（最低約 ${Math.round(nightMin)}°C），適合夜遊或戶外活動。`
        });
      } else if (todayProb >= 50 || nightMin < 14) {
        items.push({
          type: 'info',
          icon: '🌃',
          text: `今晚可能有雨或氣溫偏低（最低約 ${Math.round(nightMin)}°C），夜遊建議帶外套或雨具。`
        });
      }

      // Humidity
      if (humidity >= 85 && temp >= 24) {
        items.push({
          type: 'info',
          icon: '💧',
          text: `濕度偏高（${humidity}%），感覺較悶，外出可選擇透氣材質衣物。`
        });
      }

      items.forEach(item => {
        const div = document.createElement('div');
        div.className = `advice-item ${item.type}`;
        div.innerHTML = `<span class="icon">${item.icon}</span><span>${item.text}</span>`;
        list.appendChild(div);
      });
    }

    function renderForecast(daily) {
      const grid = $('forecast-grid');
      grid.innerHTML = '';

      for (let i = 0; i < daily.time.length; i++) {
        const { weekday, date } = formatDate(daily.time[i]);
        const info = getWeatherInfo(daily.weather_code[i]);
        const high = Math.round(daily.temperature_2m_max[i]);
        const low = Math.round(daily.temperature_2m_min[i]);
        const prob = daily.precipitation_probability_max[i] || 0;
        const sum = daily.precipitation_sum[i] || 0;

        const card = document.createElement('div');
        card.className = 'day-card' + (i === 0 ? ' today' : '');
        card.innerHTML = `
          <div class="day-name">${i === 0 ? '今天' : weekday}</div>
          <div class="day-date">${date}</div>
          <div class="day-icon">${info.icon}</div>
          <div class="day-temps">
            <span class="high">${high}°</span> / <span class="low">${low}°</span>
          </div>
          <div class="day-rain">${prob > 0 ? `降雨 ${prob}%` : '幾乎無雨'}</div>
          ${sum > 0 ? `<div class="day-precip">${sum.toFixed(1)} mm</div>` : ''}
        `;
        grid.appendChild(card);
      }
    }

    // ========== Geolocation ==========
    btnGeo.addEventListener('click', () => {
      if (!navigator.geolocation) {
        showError('您的瀏覽器不支援定位功能。');
        return;
      }
      btnGeo.disabled = true;
      statusEl.textContent = '正在取得位置…';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          btnGeo.disabled = false;
          statusEl.textContent = '';
          fetchWeather(latitude, longitude, '我的位置');
        },
        (err) => {
          btnGeo.disabled = false;
          statusEl.textContent = '';
          let msg = '無法取得位置。';
          if (err.code === 1) msg = '您拒絕了位置權限，請允許後再試。';
          else if (err.code === 2) msg = '無法偵測到位置，請確認定位服務已開啟。';
          else if (err.code === 3) msg = '定位逾時，請稍後再試。';
          showError(msg);
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
      );
    });

    // ========== Init ==========
    fetchWeather(TAIPEI.lat, TAIPEI.lon, TAIPEI.name);
  </script>
</body>
</html>
