<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="使用 Open-Meteo 免費天氣資料的智慧天氣預報網頁，預設顯示台北天氣，可切換至您的位置，提供現在天氣、7 天預報與生活建議（帶傘、穿著、運動等）。">
  <title>智慧天氣預報 | ONLY ZERO</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="shortcut icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F2G4LV0CVW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F2G4LV0CVW');
  </script>
  <style>
    :root {
      --blue: #1A3F97;
      --blue-dark: #133075;
      --cyan: #61B9DD;
      --yellow: #F4D21F;
      --white: #FFFFFF;
      --bg: #F4F7FC;
      --text: #1A3F97;
      --text-muted: #5A6B8A;
      --card: #FFFFFF;
      --border: rgba(26, 63, 151, 0.08);
      --shadow: 0 10px 30px rgba(26, 63, 151, 0.06);
      --shadow-hover: 0 14px 36px rgba(26, 63, 151, 0.11);
      --radius: 22px;
      --anim-pulse: 2s;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--blue) rgba(26, 63, 151, 0.08);
    }

    body {
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      background-image: radial-gradient(circle at 10% 0%, rgba(97, 185, 221, 0.14) 0%, transparent 45%),
                        radial-gradient(circle at 90% 10%, rgba(244, 210, 31, 0.08) 0%, transparent 40%);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(26, 63, 151, 0.05); }
    ::-webkit-scrollbar-thumb {
      background: var(--blue);
      border-radius: 999px;
      border: 2px solid var(--bg);
    }

    .container {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0 1.5rem 3.5rem;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.4rem 0 1.6rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--blue);
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 0 0 4px rgba(97, 185, 221, 0.22);
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .location-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
    }

    .location-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--blue);
      background: var(--white);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      box-shadow: 0 2px 10px rgba(26, 63, 151, 0.04);
    }

    .location-badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    button {
      appearance: none;
      border: 1.5px solid rgba(26, 63, 151, 0.16);
      background: var(--white);
      color: var(--blue);
      padding: 0.48rem 1.05rem;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.22s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    button svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    button:hover {
      background: rgba(26, 63, 151, 0.06);
      border-color: var(--blue);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    button.primary {
      background: var(--blue);
      color: var(--white);
      border-color: var(--blue);
      box-shadow: 0 4px 14px rgba(26, 63, 151, 0.2);
    }

    button.primary:hover {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
      box-shadow: 0 6px 18px rgba(26, 63, 151, 0.26);
    }

    .status {
      font-size: 0.84rem;
      color: var(--text-muted);
      min-height: 1.2em;
      margin-bottom: 0.6rem;
      text-align: right;
    }

    .error {
      color: #b91c1c;
      background: #fef2f2;
      border: 1.5px solid #fecaca;
      padding: 0.85rem 1.15rem;
      border-radius: 14px;
      margin-bottom: 1.2rem;
      font-size: 0.9rem;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .error-retry {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 0.35rem 0.85rem;
      font-size: 0.82rem;
    }

    .error-retry:hover {
      background: #b91c1c;
    }

    /* Main Grid Layout (Hero + Advice) */
    .dashboard-top {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 1.4rem;
      align-items: stretch;
      margin-bottom: 1.4rem;
    }

    /* Cards */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1.5px solid var(--border);
      padding: 1.6rem 1.75rem;
      transition: box-shadow 0.3s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.15rem;
    }

    .section-title {
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--blue);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title::before {
      content: "";
      width: 10px;
      height: 10px;
      background: var(--yellow);
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulseSoft var(--anim-pulse) ease-in-out infinite;
    }

    .section-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    @keyframes pulseSoft {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.7; }
    }

    /* ========== Current Weather Card (Dynamic Weather Themes) ========== */
    .current-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(145deg, #3898D4 0%, #58B4E3 58%, #77C9EE 100%);
      color: var(--white);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 12px 32px rgba(56, 152, 212, 0.22);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s ease-out 0.05s forwards;
      transition: background 0.6s ease, box-shadow 0.6s ease;
    }

    /* 晴朗白天 */
    .current-card.theme-sunny {
      background: linear-gradient(145deg, #2B8FD9 0%, #52B3EC 55%, #7CCBF7 100%);
      box-shadow: 0 12px 32px rgba(43, 143, 217, 0.24);
    }

    /* 多雲 / 陰天 / 霧 */
    .current-card.theme-cloudy {
      background: linear-gradient(145deg, #5B7999 0%, #7896B5 55%, #97B2CE 100%);
      box-shadow: 0 12px 32px rgba(91, 121, 153, 0.24);
    }

    /* 下雨 / 陣雨 */
    .current-card.theme-rain {
      background: linear-gradient(145deg, #356291 0%, #4E7FB0 58%, #6B9AC7 100%);
      box-shadow: 0 12px 32px rgba(53, 98, 145, 0.26);
    }

    /* 雷雨 */
    .current-card.theme-storm {
      background: linear-gradient(145deg, #434970 0%, #5D6591 58%, #7981AD 100%);
      box-shadow: 0 12px 32px rgba(67, 73, 112, 0.28);
    }

    /* 下雪 */
    .current-card.theme-snow {
      background: linear-gradient(145deg, #588BAE 0%, #7BAAC9 58%, #9EC6E0 100%);
      box-shadow: 0 12px 32px rgba(88, 139, 174, 0.24);
    }

    /* 夜晚 */
    .current-card.theme-night {
      background: linear-gradient(145deg, #1E3566 0%, #2F4F8F 58%, #466BB3 100%);
      box-shadow: 0 12px 32px rgba(30, 53, 102, 0.28);
    }

    .current-card::before {
      content: "";
      position: absolute;
      bottom: -55px;
      left: -45px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .current-card::after {
      content: "";
      position: absolute;
      top: -45px;
      right: -45px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 210, 31, 0.28) 0%, transparent 70%);
      pointer-events: none;
    }

    .current-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.4rem;
      position: relative;
      z-index: 1;
    }

    .current-temp-wrap {
      display: flex;
      flex-direction: column;
    }

    .current-label {
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      font-weight: 600;
      opacity: 0.9;
      margin-bottom: 0.2rem;
    }

    .current-temp {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      text-shadow: 0 2px 10px rgba(26, 63, 151, 0.12);
    }

    .current-desc {
      font-size: 1.15rem;
      font-weight: 700;
      margin-top: 0.35rem;
      color: var(--white);
    }

    /* ========== Animated Weather Hero Icon (Yellow Box) ========== */
    .current-icon {
      font-size: 4.5rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 6px 16px rgba(26, 63, 151, 0.18));
      user-select: none;
    }

    .current-icon.anim-sun {
      animation: iconSunSpin 18s linear infinite, iconSunGlow 3.2s ease-in-out infinite;
    }
    .current-icon.anim-cloud {
      animation: iconCloudDrift 4.2s ease-in-out infinite;
    }
    .current-icon.anim-rain {
      animation: iconRainBob 2.4s ease-in-out infinite;
    }
    .current-icon.anim-storm {
      animation: iconStormPulse 3s ease-in-out infinite;
    }

    @keyframes iconSunSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes iconSunGlow {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(255, 230, 100, 0.45)); }
      50% { filter: drop-shadow(0 0 24px rgba(255, 230, 100, 0.85)); }
    }
    @keyframes iconCloudDrift {
      0%, 100% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(6px) translateY(-4px); }
    }
    @keyframes iconRainBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes iconStormPulse {
      0%, 88%, 100% { transform: scale(1); filter: drop-shadow(0 6px 16px rgba(26, 63, 151, 0.18)); }
      91% { transform: scale(1.06) translateX(-2px); filter: drop-shadow(0 0 22px rgba(250, 204, 21, 0.9)); }
      94% { transform: scale(1) translateX(2px); }
      97% { transform: scale(1.05); filter: drop-shadow(0 0 18px rgba(250, 204, 21, 0.75)); }
    }

    /* 2x2 Metrics Grid inside Hero Card */
    .current-metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.65rem;
      position: relative;
      z-index: 1;
    }

    .metric-box {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 14px;
      padding: 0.65rem 0.85rem;
      display: flex;
      flex-direction: column;
    }

    .metric-label {
      font-size: 0.76rem;
      font-weight: 500;
      opacity: 0.92;
    }

    .metric-val {
      font-size: 1.06rem;
      font-weight: 700;
      margin-top: 0.1rem;
    }

    /* Advice Card (Right) */
    .advice-card {
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s ease-out 0.15s forwards;
    }

    .advice-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      flex: 1;
      align-content: start;
    }

    /* ========== Wind Visualizer Banner inside Advice ========== */
    .wind-visual-card {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #F4F9FE 0%, #EBF4FC 100%);
      border: 1.5px solid rgba(97, 185, 221, 0.32);
      border-radius: 16px;
      padding: 0.8rem 1.15rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .wind-info {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .wind-title-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .wind-badge {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      background: rgba(26, 63, 151, 0.08);
      color: var(--blue);
    }

    .wind-badge.strong {
      background: rgba(245, 158, 11, 0.16);
      color: #b45309;
    }

    .wind-speed-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--blue);
    }

    .wind-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .wind-scene {
      width: 148px;
      height: 62px;
      flex-shrink: 0;
      overflow: visible;
    }

    /* Windmill & Grass Animations */
    .windmill-blades {
      transform-origin: 44px 26px;
      animation: bladeSpin var(--spin-dur, 4s) linear infinite;
    }

    .grass-blade {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: grassSway var(--sway-dur, 2.8s) ease-in-out infinite;
    }

    .grass-blade.g2 { animation-delay: -0.6s; }
    .grass-blade.g3 { animation-delay: -1.2s; }

    .wind-gust {
      stroke-dasharray: 28;
      stroke-dashoffset: 56;
      animation: gustFlow var(--gust-dur, 2.6s) linear infinite;
    }
    .wind-gust.line2 { animation-delay: -1.1s; }

    @keyframes bladeSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes grassSway {
      0%, 100% { transform: rotate(var(--sway-min, -3deg)); }
      50% { transform: rotate(var(--sway-max, 10deg)); }
    }

    @keyframes gustFlow {
      0% { stroke-dashoffset: 56; opacity: 0; }
      30% { opacity: 0.85; }
      70% { opacity: 0.85; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .advice-item {
      background: #F8FAFD;
      border: 1px solid rgba(26, 63, 151, 0.08);
      border-radius: 16px;
      padding: 0.85rem 0.95rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      font-size: 0.88rem;
      line-height: 1.55;
      color: var(--text);
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .advice-item:hover {
      background: #F2F6FD;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(26, 63, 151, 0.05);
    }

    /* Unified SVG Icon Badge */
    .advice-icon-wrap {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 0.05rem;
    }

    .advice-icon-wrap svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.1;
    }

    .advice-item.good { border-left: 3.5px solid #10b981; }
    .advice-item.good .advice-icon-wrap {
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
    }

    .advice-item.warn { border-left: 3.5px solid #f59e0b; }
    .advice-item.warn .advice-icon-wrap {
      background: rgba(245, 158, 11, 0.14);
      color: #d97706;
    }

    .advice-item.rain { border-left: 3.5px solid #0ea5e9; }
    .advice-item.rain .advice-icon-wrap {
      background: rgba(14, 165, 233, 0.13);
      color: #0284c7;
    }

    .advice-item.info { border-left: 3.5px solid #6366f1; }
    .advice-item.info .advice-icon-wrap {
      background: rgba(99, 102, 241, 0.12);
      color: #4f46e5;
    }

    /* Forecast Section */
    .forecast-card {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s ease-out 0.25s forwards;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.85rem;
    }

    .day-card {
      background: #F8FAFD;
      border: 1.5px solid rgba(26, 63, 151, 0.07);
      border-radius: 18px;
      padding: 1.1rem 0.9rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.22s ease;
    }

    .day-card:hover {
      background: var(--white);
      border-color: rgba(26, 63, 151, 0.2);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(26, 63, 151, 0.07);
    }

    .day-card.today {
      background: linear-gradient(180deg, rgba(97, 185, 221, 0.15) 0%, rgba(97, 185, 221, 0.04) 100%);
      border-color: rgba(97, 185, 221, 0.65);
    }

    .day-header {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
      margin-bottom: 0.45rem;
    }

    .day-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--blue);
    }

    .day-date {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .day-icon {
      font-size: 2.1rem;
      margin: 0.25rem 0;
      line-height: 1.2;
    }

    .day-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
    }

    .day-temps {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .day-temps .high { color: #e11d48; }
    .day-temps .sep { color: #cbd5e1; margin: 0 0.2rem; font-weight: 400; }
    .day-temps .low { color: #2563eb; }

    .day-rain {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.76rem;
      color: #0284c7;
      background: rgba(14, 165, 233, 0.1);
      padding: 0.18rem 0.65rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .day-rain.dry {
      color: var(--text-muted);
      background: rgba(90, 107, 138, 0.08);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 5rem 1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(26, 63, 151, 0.12);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      text-align: center;
      padding: 1.8rem 0 0.5rem;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      color: var(--cyan);
      text-decoration: underline;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.65rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--blue); }

    /* Tablet */
    @media (max-width: 920px) {
      .dashboard-top {
        grid-template-columns: 1fr;
      }
      .current-card {
        flex-direction: row;
        align-items: center;
        gap: 1.5rem;
      }
      .current-top {
        margin-bottom: 0;
        flex: 1;
      }
      .current-metrics {
        flex: 1;
      }
    }

    /* Mobile */
    @media (max-width: 640px) {
      .container { padding: 0 1rem 2.5rem; }
      .card { padding: 1.3rem 1.2rem; }
      .current-card {
        flex-direction: column;
        align-items: stretch;
      }
      .current-top {
        margin-bottom: 1.2rem;
      }
      .current-temp { font-size: 3.4rem; }
      .current-icon { font-size: 3.8rem; }
      .advice-list {
        grid-template-columns: 1fr;
      }
      .wind-visual-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .wind-scene {
        align-self: flex-end;
      }
      .forecast-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.65rem;
      }
      .brand h1 { font-size: 1.15rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .current-card, .advice-card, .forecast-card {
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="top-bar">
      <a href="index.html" class="brand" aria-label="回到首頁">
        <span class="brand-logo" aria-hidden="true"></span>
        <div>
          <h1>智慧天氣預報</h1>
          <div class="brand-sub">ONLY ZERO</div>
        </div>
      </a>
      <div class="location-actions">
        <span class="location-badge" id="location-name">台北</span>
        <button id="btn-taipei" type="button" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/>

          台北
        </button>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    <div id="error" class="error">

      <button id="btn-retry" class="error-retry" type="button">重新載入</button>
    </div>
    <div id="status" class="status"></div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      正在載入天氣資料…
    </div>

    <main id="content" style="display: none;">
      <div class="dashboard-top">
        <!-- Current Weather Hero -->
        <section class="card current-card" id="current-card">
          <div class="current-top">
            <div class="current-temp-wrap">
              <span class="current-label">現在天氣</span>
              <div class="current-temp"><span id="temp">--</span>°</div>
              <div class="current-desc" id="weather-desc">--</div>

            <div class="current-icon" id="weather-icon">🌤️</div>

          <div class="current-metrics">
            <div class="metric-box">
              <span class="metric-label">體感溫度</span>
              <span class="metric-val"><span id="feels-like">--</span>°C</span>
            </div>
            <div class="metric-box">
              <span class="metric-label">相對濕度</span>
              <span class="metric-val"><span id="humidity">--</span>%</span>
            </div>
            <div class="metric-box">
              <span class="metric-label">目前風速</span>
              <span class="metric-val"><span id="wind">--</span> km/h</span>
            </div>
            <div class="metric-box">
              <span class="metric-label">時雨量</span>
              <span class="metric-val"><span id="precip-now">--</span> mm</span>

        </section>

        <!-- Advice -->
        <section class="card advice-card">
          <div class="section-header">
            <h2 class="section-title">今日生活建議</h2>
            <span class="section-sub">依即時氣象自動生成</span>
          </div>
          <div class="advice-list" id="advice-list"></div>
        </section>
      </div>

      <!-- Forecast -->
      <section class="card forecast-card">
        <div class="section-header">
          <h2 class="section-title">今日與未來 7 天預報</h2>
          <span class="section-sub">最高溫 / 最低溫</span>
        </div>
        <div class="forecast-grid" id="forecast-grid"></div>
      </section>
    </main>

    <footer>
      天氣資料由 <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> 提供 · 僅供參考
      <br>
      <a href="index.html" class="back-link">← 回到 ONLY ZERO 首頁</a>
    </footer>
  </div>

  <script>
    // ========== Config ==========
    const TAIPEI = { lat: 25.0330, lon: 121.5654, name: '台北' };
    const API_BASE = 'https://api.open-meteo.com/v1/forecast';
    const CACHE_KEY = 'onlyzero_weather_cache_v1';
    let lastQuery = { ...TAIPEI };

    // ========== Clean SVG Icons for Advice ==========
    const ADVICE_ICONS = {
      umbrella: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12a10.06 10.06 1 0 0-20 0Z"/><path d="M12 12v8a2 2 0 0 0 4 0"/><path d="M12 2v1"/></svg>`,
      raincoat: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>`,
      sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`,
      layers: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>`,
      cold: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/><path d="M12 11v6"/></svg>`,
      hot: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/><path d="M12 7v10"/></svg>`,
      shirt: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>`,
      wind: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>`,
      activity: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
      indoor: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
      moon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`,
      droplet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>`
    };

    // ========== Weather code map (WMO) ==========
    const WEATHER_CODES = {
      0:  { desc: '晴朗', icon: '☀️' },
      1:  { desc: '大致晴朗', icon: '🌤️' },
      2:  { desc: '局部多雲', icon: '⛅' },
      3:  { desc: '陰天', icon: '☁️' },
      45: { desc: '有霧', icon: '🌫️' },
      48: { desc: '霧凇', icon: '🌫️' },
      51: { desc: '微毛毛雨', icon: '🌦️' },
      53: { desc: '毛毛雨', icon: '🌦️' },
      55: { desc: '濃毛毛雨', icon: '🌧️' },
      56: { desc: '凍毛毛雨', icon: '🌧️' },
      57: { desc: '濃凍毛毛雨', icon: '🌧️' },
      61: { desc: '小雨', icon: '🌧️' },
      63: { desc: '中雨', icon: '🌧️' },
      65: { desc: '大雨', icon: '🌧️' },
      66: { desc: '凍雨', icon: '🌧️' },
      67: { desc: '強凍雨', icon: '🌧️' },
      71: { desc: '小雪', icon: '🌨️' },
      73: { desc: '中雪', icon: '🌨️' },
      75: { desc: '大雪', icon: '❄️' },
      77: { desc: '雪粒', icon: '🌨️' },
      80: { desc: '小陣雨', icon: '🌦️' },
      81: { desc: '中陣雨', icon: '🌧️' },
      82: { desc: '強陣雨', icon: '🌧️' },
      85: { desc: '小陣雪', icon: '🌨️' },
      86: { desc: '強陣雪', icon: '❄️' },
      95: { desc: '雷雨', icon: '⛈️' },
      96: { desc: '雷雨夾冰雹', icon: '⛈️' },
      99: { desc: '強雷雨夾冰雹', icon: '⛈️' }
    };

    function getWeatherInfo(code) {
      return WEATHER_CODES[code] || { desc: '未知', icon: '🌡️' };
    }

    // Determine card theme & icon animation from weather code & is_day
    function getWeatherTheme(code, isDay) {
      if ([95, 96, 99].includes(code)) {
        return { theme: 'theme-storm', anim: 'anim-storm' };
      }
      if ([71, 73, 75, 77, 85, 86].includes(code)) {
        return { theme: 'theme-snow', anim: 'anim-rain' };
      }
      if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) {
        return { theme: 'theme-rain', anim: 'anim-rain' };
      }
      if (isDay === 0) {
        return {
          theme: 'theme-night',
          anim: [0, 1].includes(code) ? 'anim-sun' : 'anim-cloud'
        };
      }
      if ([0, 1].includes(code)) {
        return { theme: 'theme-sunny', anim: 'anim-sun' };
      }
      return { theme: 'theme-cloudy', anim: 'anim-cloud' };
    }

    // ========== DOM ==========
    const $ = (id) => document.getElementById(id);
    const loadingEl = $('loading');
    const contentEl = $('content');
    const errorEl = $('error');
    const errorTextEl = $('error-text');
    const statusEl = $('status');
    const btnGeo = $('btn-geo');
    const btnTaipei = $('btn-taipei');
    const btnRetry = $('btn-retry');

    // ========== Helpers ==========
    function showError(msg) {
      errorTextEl.textContent = msg;
      errorEl.style.display = 'flex';
    }
    function clearError() {
      errorEl.style.display = 'none';
      errorTextEl.textContent = '';
    }

    function formatDate(iso) {
      const d = new Date(iso + 'T12:00:00');
      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      return {
        weekday: '週' + weekdays[d.getDay()],
        date: `${d.getMonth() + 1}/${d.getDate()}`
      };
    }

    function saveCache(data, name) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          timestamp: Date.now(),
          name,
          data
        }));
      } catch (_) {}
    }

    function loadCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (_) {
        return null;
      }
    }

    // ========== Fetch weather ==========
    async function fetchWeather(lat, lon, name) {
      lastQuery = { lat, lon, name };
      clearError();
      loadingEl.style.display = 'block';
      contentEl.style.display = 'none';
      statusEl.textContent = '';

      const params = new URLSearchParams({
        latitude: lat,
        longitude: lon,
        current: 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,is_day',
        daily: 'weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset',
        timezone: 'auto',
        forecast_days: 8
      });

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      try {
        const res = await fetch(`${API_BASE}?${params}`, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        saveCache(data, name);
        renderWeather(data, name);
      } catch (err) {
        clearTimeout(timeoutId);
        const reason = err.name === 'AbortError' ? '連線逾時' : (err.message || '網路異常');
        const cached = loadCache();
        if (cached && cached.data) {
          renderWeather(cached.data, cached.name);
          const timeStr = new Date(cached.timestamp).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
          showError(`即時連線失敗（${reason}），目前已為您顯示 ${timeStr} 的快取資料。`);
        } else {
          showError(`無法取得天氣資料（${reason}），請確認網路連線後重試。`);
          loadingEl.style.display = 'none';
        }
      }
    }

    // ========== Render ==========
    function renderWeather(data, name) {
      const cur = data.current;
      const daily = data.daily;
      const info = getWeatherInfo(cur.weather_code);
      const { theme, anim } = getWeatherTheme(cur.weather_code, cur.is_day);

      // Update current card color theme & icon micro-animation
      const currentCard = $('current-card');
      currentCard.className = `card current-card ${theme}`;

      const weatherIconEl = $('weather-icon');
      weatherIconEl.className = `current-icon ${anim}`;
      weatherIconEl.textContent = info.icon;

      $('location-name').textContent = name;
      btnTaipei.style.display = name === TAIPEI.name ? 'none' : 'inline-flex';

      $('temp').textContent = Math.round(cur.temperature_2m);
      $('weather-desc').textContent = info.desc;
      $('feels-like').textContent = Math.round(cur.apparent_temperature);
      $('humidity').textContent = cur.relative_humidity_2m;
      $('wind').textContent = Math.round(cur.wind_speed_10m);
      $('precip-now').textContent = cur.precipitation.toFixed(1);

      renderAdvice(cur, daily);
      renderForecast(daily);

      loadingEl.style.display = 'none';
      contentEl.style.display = 'block';
    }

    // Build animated windmill + swaying grass widget based on wind speed
    function createWindWidget(wind, maxWind) {
      let levelLabel = '微風徐徐';
      let desc = '空氣流動輕柔，風車悠閒慢轉、小草輕輕點頭。';
      let spinDur = '6.5s';
      let swayDur = '3.6s';
      let gustDur = '3.8s';
      let swayMin = '-2deg';
      let swayMax = '6deg';
      let isStrong = false;

      if (wind >= 30 || maxWind >= 35) {
        levelLabel = '強風陣陣';
        desc = '風勢強勁，風車高速旋轉、小草大幅傾擺，請留意防風。';
        spinDur = '0.65s';
        swayDur = '0.75s';
        gustDur = '0.95s';
        swayMin = '12deg';
        swayMax = '32deg';
        isStrong = true;
      } else if (wind >= 20) {
        levelLabel = '清風有感';
        desc = '風勢明顯，風車快速轉動、草葉隨風擺動，體感較涼爽。';
        spinDur = '1.5s';
        swayDur = '1.3s';
        gustDur = '1.6s';
        swayMin = '4deg';
        swayMax = '20deg';
        isStrong = true;
      } else if (wind >= 10) {
        levelLabel = '和風舒適';
        desc = '風力適中，風車穩定轉動、小草自然搖曳，體感十分愜意。';
        spinDur = '3.2s';
        swayDur = '2.2s';
        gustDur = '2.5s';
        swayMin = '-2deg';
        swayMax = '12deg';
      }

      const card = document.createElement('div');
      card.className = 'wind-visual-card';
      card.style.setProperty('--spin-dur', spinDur);
      card.style.setProperty('--sway-dur', swayDur);
      card.style.setProperty('--gust-dur', gustDur);
      card.style.setProperty('--sway-min', swayMin);
      card.style.setProperty('--sway-max', swayMax);

      card.innerHTML = `
        <div class="wind-info">
          <div class="wind-title-row">
            <span class="wind-speed-text">即時風速 ${Math.round(wind)} km/h</span>
            <span class="wind-badge ${isStrong ? 'strong' : ''}">${levelLabel}</span>
          </div>
          <div class="wind-desc">${desc}</div>
        </div>
        <svg class="wind-scene" viewBox="0 0 150 64" fill="none" aria-hidden="true">
          <!-- Ground hill -->
          <path d="M12 58 Q 75 50 138 58" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Windmill tower -->
          <path d="M40 55 L43 26 L45 26 L48 55 Z" fill="#1A3F97" opacity="0.85"/>
          <!-- Rotating blades -->
          <g class="windmill-blades">
            <path d="M44 26 L41.5 8 Q44 5 46.5 8 Z" fill="#3898D4"/>
            <path d="M44 26 L60 33 Q61 36 57.5 37.5 Z" fill="#61B9DD"/>
            <path d="M44 26 L28 37.5 Q25 36 26.5 33 Z" fill="#1A3F97"/>
            <circle cx="44" cy="26" r="3.2" fill="#F4D21F" stroke="#1A3F97" stroke-width="1.5"/>
          </g>
          <!-- Swaying grass blades -->
          <g class="grass-blade g1">
            <path d="M88 55 Q87 42 93 34" stroke="#10B981" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="93" cy="33" r="2.2" fill="#F4D21F"/>
          </g>
          <g class="grass-blade g2">
            <path d="M102 55 Q101 38 109 29" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
            <circle cx="109" cy="28" r="2.5" fill="#FB7185"/>
          </g>
          <g class="grass-blade g3">
            <path d="M116 55 Q116 43 122 36" stroke="#34D399" stroke-width="2.3" stroke-linecap="round"/>
          </g>
          <!-- Wind stream lines -->
          <path class="wind-gust" d="M68 15 Q82 11 96 15" stroke="#61B9DD" stroke-width="2" stroke-linecap="round"/>
          <path class="wind-gust line2" d="M74 23 Q90 20 106 23" stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      `;
      return card;
    }

    function renderAdvice(cur, daily) {
      const list = $('advice-list');
      list.innerHTML = '';

      const temp = cur.temperature_2m;
      const feels = cur.apparent_temperature;
      const humidity = cur.relative_humidity_2m;
      const wind = cur.wind_speed_10m;
      const precip = cur.precipitation;
      const code = cur.weather_code;

      const todayProb = daily.precipitation_probability_max[0] || 0;
      const todayPrecip = daily.precipitation_sum[0] || 0;
      const todayMax = daily.temperature_2m_max[0];
      const todayMin = daily.temperature_2m_min[0];
      const tempDiff = todayMax - todayMin;
      const maxWind = daily.wind_speed_10m_max[0] || wind;

      // Insert interactive wind visualizer at top
      list.appendChild(createWindWidget(wind, maxWind));

      const items = [];

      // Rain / umbrella
      if (todayProb >= 50 || todayPrecip >= 1 || precip > 0.2) {
        items.push({
          type: 'rain',
          icon: ADVICE_ICONS.umbrella,
          text: `今日降雨機率約 ${todayProb}%${todayPrecip > 0 ? `（預計 ${todayPrecip.toFixed(1)} mm）` : ''}，建議隨身攜帶雨傘。`
        });
        if (todayProb >= 70 || todayPrecip >= 5 || [61,63,65,80,81,82,95,96,99].includes(code)) {
          items.push({
            type: 'rain',
            icon: ADVICE_ICONS.raincoat,
            text: '雨勢可能較大，建議穿防水外套或雨衣，並考慮防水鞋。'
          });
        }
      } else if (todayProb >= 30) {
        items.push({
          type: 'info',
          icon: ADVICE_ICONS.umbrella,
          text: `今日有小雨機會（約 ${todayProb}%），出門可帶把摺疊傘以防萬一。`
        });
      } else {
        items.push({
          type: 'good',
          icon: ADVICE_ICONS.sun,
          text: '今日降雨機率低，天氣相對穩定，外出較舒適。'
        });
      }

      // Temperature & clothing
      if (tempDiff >= 8) {
        items.push({
          type: 'warn',
          icon: ADVICE_ICONS.layers,
          text: `早晚溫差約 ${Math.round(tempDiff)}°C（${Math.round(todayMin)}°～${Math.round(todayMax)}°），建議洋蔥式穿法方便增減。`
        });
      }

      if (feels <= 15) {
        items.push({
          type: 'info',
          icon: ADVICE_ICONS.cold,
          text: `體感溫度約 ${Math.round(feels)}°C，感覺偏涼，建議多加一件外套或長袖。`
        });
      } else if (feels >= 30) {
        items.push({
          type: 'warn',
          icon: ADVICE_ICONS.hot,
          text: `體感溫度約 ${Math.round(feels)}°C，感覺悶熱，建議穿輕薄透氣衣物並多補水。`
        });
      } else if (temp >= 22 && temp <= 28) {
        items.push({
          type: 'good',
          icon: ADVICE_ICONS.shirt,
          text: `目前氣溫舒適（約 ${Math.round(temp)}°C），短袖或薄長袖都適合。`
        });
      }

      // Running
      const goodForRun = todayProb < 60 && precip < 1 && temp >= 12 && temp <= 30 && wind < 25 && ![65,82,95,96,99].includes(code);
      if (goodForRun) {
        items.push({
          type: 'good',
          icon: ADVICE_ICONS.activity,
          text: '適合戶外跑步或運動，記得做好熱身與補充水分。'
        });
      } else if (todayProb >= 60 || precip > 1 || [65,82,95,96,99].includes(code)) {
        items.push({
          type: 'warn',
          icon: ADVICE_ICONS.indoor,
          text: '降雨機率高或天候不佳，建議改為室內運動或等雨停再出門。'
        });
      } else {
        items.push({
          type: 'info',
          icon: ADVICE_ICONS.activity,
          text: '若要跑步建議選擇較穩定時段，並留意路面濕滑。'
        });
      }

      // Night out
      const nightMin = todayMin;
      if (todayProb < 40 && nightMin >= 16) {
        items.push({
          type: 'good',
          icon: ADVICE_ICONS.moon,
          text: `今晚天氣尚可（最低約 ${Math.round(nightMin)}°C），適合夜間散步或戶外活動。`
        });
      } else if (todayProb >= 50 || nightMin < 14) {
        items.push({
          type: 'info',
          icon: ADVICE_ICONS.moon,
          text: `今晚可能有雨或氣溫偏低（最低約 ${Math.round(nightMin)}°C），外出建議帶外套或雨具。`
        });
      }

      // Humidity
      if (humidity >= 85 && temp >= 24) {
        items.push({
          type: 'info',
          icon: ADVICE_ICONS.droplet,
          text: `濕度偏高（${humidity}%），感覺較悶，建議穿著排汗透氣材質。`
        });
      }

      items.forEach(item => {
        const div = document.createElement('div');
        div.className = `advice-item ${item.type}`;
        div.innerHTML = `<span class="advice-icon-wrap" aria-hidden="true">${item.icon}</span><span>${item.text}</span>`;
        list.appendChild(div);
      });
    }

    function renderForecast(daily) {
      const grid = $('forecast-grid');
      grid.innerHTML = '';

      for (let i = 0; i < daily.time.length; i++) {
        const { weekday, date } = formatDate(daily.time[i]);
        const info = getWeatherInfo(daily.weather_code[i]);
        const high = Math.round(daily.temperature_2m_max[i]);
        const low = Math.round(daily.temperature_2m_min[i]);
        const prob = daily.precipitation_probability_max[i] || 0;
        const sum = daily.precipitation_sum[i] || 0;

        const rainText = prob > 0
          ? `降雨 ${prob}%${sum > 0 ? ` · ${sum.toFixed(1)}mm` : ''}`
          : '幾乎無雨';

        const card = document.createElement('div');
        card.className = 'day-card' + (i === 0 ? ' today' : '');
        card.innerHTML = `
          <div class="day-header">
            <span class="day-name">${i === 0 ? '今天' : weekday}</span>
            <span class="day-date">${date}</span>
          </div>
          <div class="day-icon">${info.icon}</div>
          <div class="day-desc">${info.desc}</div>
          <div class="day-temps">
            <span class="high">${high}°</span><span class="sep">/</span><span class="low">${low}°</span>
          </div>
          <div class="day-rain ${prob === 0 ? 'dry' : ''}">${rainText}</div>
        `;
        grid.appendChild(card);
      }
    }

    // ========== Events ==========
    btnRetry.addEventListener('click', () => {
      fetchWeather(lastQuery.lat, lastQuery.lon, lastQuery.name);
    });

    btnTaipei.addEventListener('click', () => {
      fetchWeather(TAIPEI.lat, TAIPEI.lon, TAIPEI.name);
    });

    btnGeo.addEventListener('click', () => {
      if (!navigator.geolocation) {
        showError('您的瀏覽器不支援定位功能。');
        return;
      }
      btnGeo.disabled = true;
      statusEl.textContent = '正在取得位置…';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          btnGeo.disabled = false;
          statusEl.textContent = '';
          fetchWeather(latitude, longitude, '我的位置');
        },
        (err) => {
          btnGeo.disabled = false;
          statusEl.textContent = '';
          let msg = '無法取得位置。';
          if (err.code === 1) msg = '您拒絕了位置權限，請允許後再試。';
          else if (err.code === 2) msg = '無法偵測到位置，請確認定位服務已開啟。';
          else if (err.code === 3) msg = '定位逾時，請稍後再試。';
          showError(msg);
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
      );
    });

    // ========== Init ==========
    fetchWeather(TAIPEI.lat, TAIPEI.lon, TAIPEI.name);
  </script>
</body>
</html>
