<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yo! 猜拳俱樂部｜ONLY ZERO</title>
<style>
:root {
  --blue: #1A3F97;
  --cyan: #61B9DD;
  --yellow: #F4D21F;
  --white: #FFFFFF;
  --bg: #F7F9FC;
  --text: #1A3F97;
  --text-muted: #5A6B8A;
  --card: #FFFFFF;
  --line: rgba(26, 63, 151, 0.12);
  --shadow: 0 8px 28px rgba(26, 63, 151, 0.08);
  --radius: 20px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Microsoft YaHei UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}
html {
  scrollbar-width: thin;
  scrollbar-color: var(--blue) rgba(26, 63, 151, 0.08);
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: rgba(26, 63, 151, 0.06); border-radius: 999px; }
::-webkit-scrollbar-thumb {
  background: var(--blue);
  border-radius: 999px;
  border: 2px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover { background: #15357d; }

body {
  display: flex;
  flex-direction: column;
  position: relative;
}
body::before,
body::after {
  content: "";
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}
body::before {
  width: 200px; height: 200px;
  border: 32px solid transparent;
  border-top-color: var(--blue);
  border-right-color: var(--blue);
  top: -60px; left: -80px;
  opacity: 0.85;
  transform: rotate(-35deg);
}
body::after {
  width: 140px; height: 140px;
  border: 24px solid transparent;
  border-top-color: var(--cyan);
  border-left-color: var(--cyan);
  bottom: 6%; right: -45px;
  opacity: 0.8;
  transform: rotate(150deg);
}

.wrap {
  position: relative;
  z-index: 1;
  height: 100%;
  height: 100dvh;
  width: 100%;
  max-width: 540px;
  margin: auto;
  padding: clamp(8px, 1.5dvh, 16px) 14px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.home-link {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  text-decoration: none;
  color: var(--blue);
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 4px;
  min-height: 30px;
  box-shadow: var(--shadow);
  transition: background 0.2s, border-color 0.2s;
}
.home-link:hover {
  border-color: rgba(26, 63, 151, 0.28);
  background: #eef3fb;
}

.brand {
  flex: none;
  text-align: center;
  margin: 0 0 clamp(6px, 1.4dvh, 14px);
}
.logo {
  font-size: clamp(24px, 4.2dvh, 40px);
  line-height: 1.1;
}
.brand h1 {
  font-size: clamp(19px, 3.1dvh, 27px);
  margin: 4px 0;
  color: var(--blue);
  letter-spacing: 0.04em;
}
.brand p {
  color: var(--text-muted);
  font-size: clamp(11px, 1.7dvh, 14px);
}

.panel {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 18px;
  padding: clamp(10px, 1.8dvh, 18px);
  margin-bottom: clamp(7px, 1.2dvh, 12px);
  box-shadow: var(--shadow);
}
h2 {
  font-size: clamp(16px, 2.5dvh, 20px);
  margin: 0 0 clamp(6px, 1.1dvh, 12px);
  color: var(--blue);
}
label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  margin: clamp(5px, 1dvh, 11px) 0 4px;
  color: var(--text-muted);
}
input, select {
  width: 100%;
  font: inherit;
  font-size: 16px;
  border: 1.5px solid var(--line);
  background: #f8fafc;
  border-radius: 12px;
  padding: clamp(8px, 1.4dvh, 12px) 14px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, select:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(97, 185, 221, 0.22);
}
button {
  font: inherit;
  font-weight: 700;
  border: 0;
  border-radius: 999px;
  padding: 8px 16px;
  min-height: clamp(38px, 6dvh, 49px);
  cursor: pointer;
  touch-action: manipulation;
  transition: background 0.2s, transform 0.15s, opacity 0.2s, box-shadow 0.2s;
}
button:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
button:active:not(:disabled) { transform: scale(0.98); }

.primary {
  background: var(--blue);
  color: white;
  box-shadow: 0 4px 14px rgba(26, 63, 151, 0.25);
}
.primary:hover:not(:disabled) { background: #15357d; }
.secondary {
  background: rgba(26, 63, 151, 0.08);
  color: var(--blue);
  border: 1.5px solid transparent;
}
.secondary:hover:not(:disabled) {
  background: rgba(26, 63, 151, 0.14);
}
.danger {
  background: rgba(220, 60, 90, 0.08);
  color: #b03050;
}
.danger:hover:not(:disabled) {
  background: rgba(220, 60, 90, 0.14);
}
.full { width: 100%; margin-top: clamp(6px, 1.1dvh, 10px); }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.hide { display: none !important; }

.notice {
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(244, 210, 31, 0.18);
  border: 1.5px solid rgba(244, 210, 31, 0.4);
  color: #7a6210;
  font-size: 14px;
  margin: 0 0 12px;
  line-height: 1.5;
}
.pill {
  display: inline-block;
  padding: 7px 12px;
  border-radius: 999px;
  background: rgba(97, 185, 221, 0.18);
  color: var(--blue);
  font-weight: 800;
  font-size: 13px;
  border: 1.5px solid rgba(97, 185, 221, 0.35);
}
.roomhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.roomnum {
  font-size: clamp(23px, 3.6dvh, 32px);
  font-weight: 900;
  letter-spacing: 5px;
  color: var(--blue);
}
.players {
  display: grid;
  gap: clamp(4px, .8dvh, 8px);
  margin: clamp(6px, 1.2dvh, 13px) 0;
}
.player {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: clamp(5px, .9dvh, 10px) 12px;
  border-radius: 12px;
  background: rgba(26, 63, 151, 0.05);
  border: 1px solid var(--line);
  font-size: clamp(12px, 1.8dvh, 15px);
}
.player small { color: var(--text-muted); }

.choices {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}
.choice {
  background: rgba(26, 63, 151, 0.04);
  border: 2px solid var(--line);
  border-radius: 16px;
  min-height: clamp(60px, 10dvh, 95px);
  padding: 5px 2px;
  color: var(--text);
  font-size: clamp(12px, 1.8dvh, 15px);
  font-weight: 700;
}
.choice span {
  display: block;
  font-size: clamp(24px, 4.5dvh, 36px);
  margin-bottom: 2px;
}
.choice:hover:not(:disabled) {
  border-color: var(--cyan);
  background: rgba(97, 185, 221, 0.12);
}
.choice.selected {
  border-color: var(--blue);
  background: rgba(26, 63, 151, 0.1);
  box-shadow: 0 0 0 3px rgba(26, 63, 151, 0.12);
}

.status {
  text-align: center;
  color: var(--text-muted);
  line-height: 1.3;
  font-size: clamp(11px, 1.7dvh, 14px);
  margin: 5px 0;
}
.result {
  text-align: center;
  padding: clamp(6px, 1dvh, 12px);
  background: rgba(97, 185, 221, 0.12);
  border: 1.5px solid rgba(97, 185, 221, 0.3);
  border-radius: 14px;
  margin: 5px 0;
}
.result strong {
  font-size: clamp(15px, 2.3dvh, 21px);
  color: var(--blue);
}
.results-list {
  text-align: left;
  font-size: clamp(10px, 1.6dvh, 13px);
  line-height: 1.4;
  margin-top: 5px;
  color: var(--text-muted);
}
.score { font-weight: 900; color: var(--blue); }
.footer {
  flex: none;
  text-align: center;
  color: var(--text-muted);
  font-size: 10px;
  margin-top: auto;
  padding-top: clamp(2px, .7dvh, 7px);
}
.tiny {
  font-size: clamp(10px, 1.5dvh, 12px);
  color: var(--text-muted);
  line-height: 1.3;
}

#toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--blue);
  color: #fff;
  border-radius: 12px;
  padding: 12px 18px;
  max-width: 90vw;
  z-index: 9;
  box-shadow: 0 8px 24px rgba(26, 63, 151, 0.3);
  font-size: 14px;
}

#lobby {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
#lobby > div[style] { height: clamp(5px, 1dvh, 12px) !important; }
#game {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: clamp(5px, 1dvh, 10px);
}
#game .panel { margin: 0; min-height: 0; }
#game .panel:first-child { flex: 0 1 auto; }
#game .panel:nth-child(2) {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
}

@media (max-width: 360px) {
  .panel { padding: 12px; }
  .choice span { font-size: 28px; }
  .choice { min-height: 90px; }
  .roomnum { font-size: 26px; }
}
@media (max-height: 650px) {
  .brand p, .footer { display: none; }
  .brand { margin-bottom: 5px; }
  .panel { padding: 9px; }
  .players { margin: 5px 0; }
  .choice { min-height: 55px; }
  .choice span { font-size: 23px; }
}
@media (max-height: 500px) {
  .brand { display: none; }
  .wrap { padding: 5px 10px; }
  #game .panel:first-child .tiny { display: none; }
  .roomnum { font-size: 22px; }
  .player { padding: 3px 8px; }
  .panel { padding: 6px; }
  .choices .choice { min-height: 42px; }
  .choice span { display: inline; font-size: 19px; }
  .status { margin: 2px 0; }
}
</style>
</head>
<body>
<main class="wrap">
  <a class="home-link" href="index.html" aria-label="回首頁">← 回首頁</a>
  <header class="brand">
    <div class="logo">✊ ✌️ ✋</div>
    <h1>猜拳俱樂部</h1>
    <p>開房、邀朋友、一起出拳！</p>
  </header>
  <div id="authNotice" class="notice">正在連線 Firebase 並進行匿名登入…</div>
  <div id="configNotice" class="notice hide">尚未設定 Firebase。請在 HTML 底部找到 <b>firebaseConfig</b>，貼上 Firebase 專案設定。</div>
  <section id="lobby" class="panel">
    <h2>開始遊戲</h2>
    <label for="name">你的暱稱</label>
    <input id="name" maxlength="16" placeholder="例如：小明" autocomplete="nickname">
    <label for="capacity">房間人數</label>
    <select id="capacity">
      <option value="2">2 人對戰</option>
      <option value="3">3 人對戰</option>
    </select>
    <button id="create" class="primary full">＋ 建立 4 位數房間</button>
    <div style="height:15px"></div>
    <label for="code">已有房號？</label>
    <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="輸入 4 位數房號">
    <button id="join" class="secondary full">加入房間 →</button>
    <p id="joinError" class="notice hide" role="alert"></p>
  </section>
  <section id="game" class="hide">
    <div class="panel">
      <div class="roomhead">
        <div>
          <div class="tiny">房間號碼</div>
          <div class="roomnum" id="roomNumber">----</div>
        </div>
        <button id="copy" class="secondary">複製房號</button>
      </div>
      <div style="margin-top:10px"><span class="pill" id="roomState">等待玩家</span></div>
      <div id="players" class="players"></div>
      <p class="tiny">所有玩家加入後即可出拳。每回合所有人出拳完成，才會公開結果。</p>
      <button id="leave" class="danger full">離開房間</button>
    </div>
    <div class="panel">
      <h2>選擇你的出拳</h2>
      <div class="choices">
        <button class="choice" data-move="rock"><span>✊</span>石頭</button>
        <button class="choice" data-move="paper"><span>✋</span>布</button>
        <button class="choice" data-move="scissors"><span>✌️</span>剪刀</button>
      </div>
      <p id="moveStatus" class="status">等待玩家加入…</p>
      <div id="result" class="result hide"></div>
      <button id="next" class="primary full hide">下一回合 →</button>
    </div>
  </section>
  <p class="footer">Firebase Realtime Database · 即時多人猜拳 · ONLY ZERO</p>
</main>
<div id="toast" class="hide" role="status"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getDatabase, ref, get, set, update, remove, onValue, runTransaction, onDisconnect, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

// ================= FIREBASE 設定：請貼在這裡 =================
// Firebase Console → 專案設定 → 你的應用程式 → 網頁 App → SDK 設定
const firebaseConfig = {
  apiKey: "AIzaSyD-_9fNUuIU25waOcQkvbVKN7jqZ-i0Zak",
  authDomain: "yooo-1d815.firebaseapp.com",
  databaseURL: "https://yooo-1d815-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "yooo-1d815",
  storageBucket: "yooo-1d815.firebasestorage.app",
  messagingSenderId: "1030568543233",
  appId: "1:1030568543233:web:955398ccdd04d1e5406c00",
  measurementId: "G-RJH6EDW7NV"
};
// ===========================================================

const $=id=>document.getElementById(id);const choices=[...document.querySelectorAll('.choice')];const names={rock:'石頭',paper:'布',scissors:'剪刀'};const icons={rock:'✊',paper:'✋',scissors:'✌️'};
let db,auth,uid='',room='',roomData=null,unsub=null,disconnectOp=null,processing=false;
$('create').disabled=true;$('join').disabled=true;
function authMessage(error){const code=error?.code||'';if(code==='auth/configuration-not-found'||code==='auth/operation-not-allowed')return 'Firebase 尚未啟用匿名登入。請到 Firebase Console → Authentication → 登入方式，啟用「匿名」並儲存，然後重新整理網頁。';if(code==='auth/unauthorized-domain')return '目前網站網域未獲 Firebase Authentication 授權，請在 Authentication → 設定 → 已授權網域新增目前網域。';if(code==='auth/network-request-failed')return '無法連線到 Firebase，請檢查網路或瀏覽器是否封鎖 Firebase。';return 'Firebase 登入失敗（'+code+'）：'+(error?.message||'未知錯誤')}
function setAuthStatus(message,ok=false){$('authNotice').textContent=message;$('authNotice').classList.toggle('hide',ok);$('create').disabled=!ok;$('join').disabled=!ok;}
const configured=!!(firebaseConfig.apiKey&&firebaseConfig.databaseURL&&firebaseConfig.projectId&&firebaseConfig.appId);
if(!configured){$('configNotice').classList.remove('hide');$('create').disabled=true;$('join').disabled=true;}else{
 try{const app=initializeApp(firebaseConfig);db=getDatabase(app);auth=getAuth(app);onAuthStateChanged(auth,u=>{uid=u?.uid||'';if(uid){setAuthStatus('',true)}else{setAuthStatus('尚未登入 Firebase，正在嘗試匿名登入…');signInAnonymously(auth).catch(e=>{setAuthStatus(authMessage(e));toast('匿名登入失敗，請依畫面提示設定 Firebase');});}},e=>setAuthStatus(authMessage(e)));}catch(e){setAuthStatus('Firebase 初始化失敗：'+e.message);}
}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hide'),4000)}
function nickname(){const n=$('name').value.trim();if(!n){toast('請先輸入暱稱');$('name').focus();return null}return n.slice(0,16)}
function ready(){if(!db||!uid){toast('尚未完成 Firebase 匿名登入，請查看頁面上方的設定提示');return false}return true}
function randCode(){return String(Math.floor(1000+Math.random()*9000))}
function newRoom(capacity,owner,name){return {host:owner,capacity,round:1,phase:'playing',players:{[owner]:{name,score:0,joinedAt:Date.now()}},moves:{},createdAt:Date.now()}}
$('create').onclick=async()=>{const n=nickname();if(!n||!ready()||processing)return;processing=true;try{let code,ok=false;for(let i=0;i<15;i++){code=randCode();const result=await runTransaction(ref(db,'rooms/'+code),v=>v===null?newRoom(Number($('capacity').value),uid,n):undefined,{applyLocally:false});if(result.committed){ok=true;break}}if(!ok)throw Error('房號暫時不足，請重試');await enter(code);}catch(e){toast('建立失敗：'+e.message)}finally{processing=false}};
$('join').onclick=async()=>{
 const n=nickname(),code=$('code').value.trim();
 if(!n||!ready()||processing)return;
 if(!/^\d{4}$/.test(code)){toast('請輸入正確的 4 位數房號');return}
 processing=true;$('join').disabled=true;$('joinError').classList.add('hide');
 try{
  const roomRef=ref(db,'rooms/'+code);
  // Fetch the server state first: a transaction callback can initially receive null.
  const initial=await get(roomRef);
  if(!initial.exists())throw Error('找不到房號 '+code+'。請房主確認仍在房間內，並核對房號。');
  const first=initial.val();
  if(!first.players||!first.capacity)throw Error('房間資料不完整，請房主重新建立房間');
  if(!first.players[uid]&&Object.keys(first.players).length>=Number(first.capacity))throw Error('房間人數已滿（'+Object.keys(first.players).length+'/'+first.capacity+'）');
  // Join atomically, so two players cannot take the last seat at the same time.
  // The first transaction callback can receive null; do not abort on that value.
  let sawRoom=false,wasFull=false;
  const result=await runTransaction(roomRef,v=>{
   if(v===null)return v; // Firebase will retry after loading the server value.
   if(!v.players||!v.capacity)return;
   sawRoom=true;
   if(v.players[uid])return v;
   if(Object.keys(v.players).length>=Number(v.capacity)){wasFull=true;return}
   v.players[uid]={name:n,score:0,joinedAt:Date.now()};
   v.moves={};v.phase='playing';v.round=(v.round||1)+1;
   return v;
  },{applyLocally:false});
  if(!result.committed){
   if(wasFull)throw Error('房間人數已滿');
   if(!sawRoom)throw Error('房間狀態無法同步，請重新建立房間或檢查資料庫規則');
   throw Error('加入交易未完成，請重試');
  }
  if(!result.snapshot.val()?.players?.[uid])throw Error('加入後無法確認玩家資料');
  await enter(code);
 }catch(e){
  console.error('[Yo! v20261021-2] 加入房間失敗',e);
  const errorCode=String(e.code||'').toLowerCase();
  let message=e.message||String(e);
  if(errorCode.includes('permission'))message='Firebase 資料庫拒絕存取（permission_denied）。請檢查 Realtime Database 規則。';
  toast('加入失敗：'+message);
  $('joinError').textContent='加入失敗：'+message+'（版本 20261021-2）';
  $('joinError').classList.remove('hide');
 }finally{processing=false;$('join').disabled=!uid}
};
async function enter(code){if(unsub)unsub();room=code;$('roomNumber').textContent=code;$('lobby').classList.add('hide');$('game').classList.remove('hide');const myPresence=ref(db,`rooms/${code}/players/${uid}`);disconnectOp=onDisconnect(myPresence);try{await disconnectOp.remove()}catch(e){console.warn('斷線清理未啟用：',e);toast('提醒：斷線自動清理未啟用，請檢查資料庫規則')}unsub=onValue(ref(db,'rooms/'+code),s=>{const data=s.val();if(!data||!data.players||!data.players[uid]){exitLocal();toast('房間已關閉或你已離開');return}roomData=data;render();},e=>toast('同步失敗：'+e.message));}
function exitLocal(){if(unsub){unsub();unsub=null}room='';roomData=null;$('game').classList.add('hide');$('lobby').classList.remove('hide')}
$('leave').onclick=async()=>{if(!room||!uid)return;const code=room;try{if(disconnectOp)await disconnectOp.cancel();await runTransaction(ref(db,'rooms/'+code),v=>{if(!v||!v.players)return v;delete v.players[uid];if(v.moves)delete v.moves[uid];const ids=Object.keys(v.players);if(!ids.length)return null;if(v.host===uid)v.host=ids[0];v.moves={};v.phase='playing';v.round=(v.round||1)+1;return v},{applyLocally:false});}catch(e){toast('離開失敗：'+e.message)}exitLocal()};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(room);toast('房號已複製')}catch{toast('房號：'+room)}};
choices.forEach(b=>b.onclick=async()=>{if(!roomData||!room||!uid)return;const ids=Object.keys(roomData.players||{});if(ids.length!==roomData.capacity||roomData.phase!=='playing'||roomData.moves?.[uid])return;const move=b.dataset.move,code=room,round=roomData.round;try{await runTransaction(ref(db,'rooms/'+code),v=>{if(!v||v.round!==round||v.phase!=='playing'||Object.keys(v.players||{}).length!==v.capacity||!v.players[uid]||v.moves?.[uid])return;v.moves=v.moves||{};v.moves[uid]=move;if(Object.keys(v.moves).length===v.capacity)v.phase='result';return v},{applyLocally:false});}catch(e){toast('出拳失敗：'+e.message)}});
function winnerIds(moves){const entries=Object.entries(moves),distinct=[...new Set(entries.map(x=>x[1]))];if(distinct.length!==2)return [];const win={rock:'scissors',scissors:'paper',paper:'rock'};const winning=distinct.find(x=>win[x]===distinct.find(y=>y!==x));return entries.filter(([,m])=>m===winning).map(([id])=>id)}
function render(){const d=roomData,ids=Object.keys(d.players||{}),full=ids.length===d.capacity,submitted=!!d.moves?.[uid];$('roomState').textContent=`第 ${d.round||1} 回合 · ${ids.length}/${d.capacity} 人`;$('players').innerHTML='';ids.forEach(id=>{const p=d.players[id],el=document.createElement('div');el.className='player';const left=document.createElement('span');left.textContent=(id===uid?'👤 ':'🎮 ')+p.name+(id===d.host?' 👑':'');const right=document.createElement('small');right.textContent=`${p.score||0} 分 · ${d.phase==='result'?(icons[d.moves?.[id]]||'—'):(d.moves?.[id]?'已出拳 ✓':'準備中')}`;el.append(left,right);$('players').append(el)});choices.forEach(b=>{b.disabled=!full||d.phase!=='playing'||submitted;b.classList.toggle('selected',submitted&&d.moves[uid]===b.dataset.move)});$('result').classList.toggle('hide',d.phase!=='result');$('next').classList.toggle('hide',d.phase!=='result');$('next').disabled=uid!==d.host;if(!full)$('moveStatus').textContent=`等待其他玩家加入（還差 ${d.capacity-ids.length} 人）`;else if(d.phase==='result')$('moveStatus').textContent='本回合已結束';else $('moveStatus').textContent=submitted?`你出了 ${names[d.moves[uid]]}，等待其他玩家…`:'大家都到齊了！選一個出拳吧';if(d.phase==='result'){const winners=winnerIds(d.moves||{});const box=$('result');box.replaceChildren();const strong=document.createElement('strong');strong.textContent=winners.length?`🏆 ${winners.map(id=>d.players[id]?.name||'玩家').join('、')} 獲勝！`:'🤝 平手！';box.append(strong);const detail=document.createElement('div');detail.className='results-list';detail.textContent=ids.map(id=>`${d.players[id].name}：${icons[d.moves[id]]||''} ${names[d.moves[id]]||'—'}`).join('　｜　');box.append(detail);$('next').textContent=uid===d.host?'下一回合 →':'等待房主開始下一回合';}}
$('next').onclick=async()=>{if(!room||!roomData||uid!==roomData.host)return;const code=room,round=roomData.round;try{await runTransaction(ref(db,'rooms/'+code),v=>{if(!v||v.host!==uid||v.phase!=='result'||v.round!==round)return;const winners=winnerIds(v.moves||{});winners.forEach(id=>{if(v.players[id])v.players[id].score=(v.players[id].score||0)+1});v.round=(v.round||1)+1;v.moves={};v.phase='playing';return v},{applyLocally:false});}catch(e){toast('無法開始下一回合：'+e.message)}};
</script></body></html>
