<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.18);
      --glass-border: rgba(255, 255, 255, 0.35);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a68;
      --accent: #e8a87c;
      --accent-hover: #d4916a;
      --bg-gradient: linear-gradient(135deg, #f5e6d3 0%, #e8d5c4 40%, #d4c4b0 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Decorative background shapes */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 420px;
      height: 420px;
      background: #f0c9a0;
      top: -80px;
      left: -100px;
    }
    body::after {
      width: 360px;
      height: 360px;
      background: #c9b8a8;
      bottom: 10%;
      right: -80px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.25rem;
      position: relative;
      z-index: 1;
    }

    /* Glass card utility */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: var(--glass-shadow);
    }

    /* Navigation */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.9rem 0;
      margin-bottom: 2rem;
    }
    nav .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1.4rem;
    }
    .logo {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 0.4rem;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 0.92rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      transition: background 0.25s, color 0.25s;
      position: relative;
    }
    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(255, 255, 255, 0.35);
      color: var(--text-primary);
    }
    .nav-links a .soon {
      font-size: 0.65rem;
      opacity: 0.7;
      margin-left: 0.15rem;
    }

    /* Mobile menu toggle */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.4rem;
      flex-direction: column;
      gap: 5px;
    }
    .menu-toggle span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--text-primary);
      border-radius: 2px;
      transition: 0.3s;
    }

    /* Hero */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 2.5rem;
      align-items: center;
      padding: 2.5rem 2rem;
      margin-bottom: 2.5rem;
    }
    .hero-photo {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 3/4;
      object-fit: cover;
      border-radius: 18px;
      border: 3px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      justify-self: center;
    }
    .hero-text h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 0.6rem;
      line-height: 1.25;
    }
    .hero-text .identity {
      font-size: 1.05rem;
      color: var(--text-secondary);
      margin-bottom: 1.6rem;
    }
    .cta-btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1.8rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
      box-shadow: 0 4px 16px rgba(232, 168, 124, 0.35);
    }
    .cta-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(232, 168, 124, 0.45);
    }

    /* Sections */
    section {
      margin-bottom: 2.2rem;
    }
    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: 0.03em;
    }
    .about-card,
    .skills-card {
      padding: 1.6rem 1.8rem;
    }
    .about-card p {
      color: var(--text-secondary);
      font-size: 0.98rem;
    }

    /* Skills / Expertise */
    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
    }
    .skill-tag {
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-size: 0.88rem;
      color: var(--text-primary);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Footer */
    footer {
      padding: 1.8rem 0 2.5rem;
      text-align: center;
    }
    footer .glass {
      padding: 1.3rem 1.5rem;
      display: inline-block;
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    footer a:hover {
      text-decoration: underline;
    }
    .footer-note {
      margin-top: 0.5rem;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .menu-toggle {
        display: flex;
      }
      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 1.25rem;
        right: 1.25rem;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 0.8rem;
        box-shadow: var(--glass-shadow);
        margin-top: 0.5rem;
      }
      .nav-links.open {
        display: flex;
      }
      .nav-links a {
        padding: 0.7rem 1rem;
      }
      nav {
        position: relative;
      }
      nav .container {
        position: relative;
      }
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
        padding: 1.8rem 1.4rem;
        gap: 1.6rem;
      }
      .hero-photo {
        max-width: 240px;
      }
      .hero-text h1 {
        font-size: 1.9rem;
      }
      .about-card,
      .skills-card {
        padding: 1.3rem 1.4rem;
      }
    }

    @media (max-width: 420px) {
      .hero-text h1 {
        font-size: 1.65rem;
      }
      .skill-tag {
        font-size: 0.82rem;
        padding: 0.4rem 0.85rem;
      }
    }

  </style>

<body>
  <nav>

      <ul class="nav-links" id="navLinks">

  <main class="container">
    <!-- Hero -->
    <section id="home" class="hero glass">
      <img

        alt="林芷菱個人照片"

      >
      <div class="hero-text">
        <h1>林芷菱</h1>
        <p class="identity">大同大學數位媒體設計研究所學生</p>
        <a href="mailto:onlyzero000111@gmail.com" class="cta-btn">聯絡我</a>
      </div>
    </section>

    <!-- About -->
    <section id="about">
      <div class="about-card glass">

    <!-- Expertise -->
    <section id="skills">

        <h2 class="section-title">專長與興趣</h2>
        <div class="skills-list">
          <span class="skill-tag">Adobe 系列軟體</span>
          <span class="skill-tag">Unity</span>
          <span class="skill-tag">互動設計</span>
          <span class="skill-tag">虛擬角色</span>
          <span class="skill-tag">登山健行</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="glass">
        <p>聯絡信箱：<a href="mailto:onlyzero000111@gmail.com">onlyzero000111@gmail.com</a></p>
        <p class="footer-note">© 2026 林芷菱</p>
      </div>
    </div>
  </footer>

  <script>
    // Mobile nav toggle
    const toggle = document.getElementById('menuToggle');
    const links = document.getElementById('navLinks');
    toggle.addEventListener('click', () => {
      links.classList.toggle('open');
    });
    // Close menu on link click
    links.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => links.classList.remove('open'));
    });
  </script>
