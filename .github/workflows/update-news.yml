name: Update News from Google Alerts

on:
  schedule:
    # 每天台灣時間早上 8:00（UTC 00:00）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允許手動執行

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch RSS and generate news.json
        run: |
          python3 << 'EOF'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from html import unescape
          import re
          import urllib.parse

          FEEDS = [
              {
                  "id": "virtual-character",
                  "name": "虛擬角色",
                  "url": "https://www.google.com/alerts/feeds/16052735769271006015/177671375465141712"
              },
              {
                  "id": "83tian",
                  "name": "八三夭",
                  "url": "https://www.google.com/alerts/feeds/16052735769271006015/177671375465141345"
              },
              {
                  "id": "toys",
                  "name": "玩具",
                  "url": "https://www.google.com/alerts/feeds/16052735769271006015/5311831855012285918"
              },
          ]

          NS = {"atom": "http://www.w3.org/2005/Atom"}

          def clean_text(text):
              if not text:
                  return ""
              text = unescape(text)
              text = re.sub(r"<[^>]+>", "", text)
              return text.strip()

          def parse_feed(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 (compatible; GitHubActions/1.0)"}
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = resp.read()

              root = ET.fromstring(data)
              items = []

              for entry in root.findall("atom:entry", NS):
                  title_el = entry.find("atom:title", NS)
                  link_el = entry.find("atom:link", NS)
                  published_el = entry.find("atom:published", NS)
                  content_el = entry.find("atom:content", NS)
                  if content_el is None:
                      content_el = entry.find("atom:summary", NS)

                  title = clean_text(title_el.text if title_el is not None else "")
                  link = link_el.get("href") if link_el is not None else ""
                  published = published_el.text if published_el is not None else ""
                  summary = clean_text(content_el.text if content_el is not None else "")

                  # Google Alerts 的 link 常是 google.com/url?url= 真實網址
                  if "url=" in link:
                      qs = urllib.parse.parse_qs(urllib.parse.urlparse(link).query)
                      if "url" in qs:
                          link = qs["url"][0]

                  if title and link:
                      items.append({
                          "title": title,
                          "link": link,
                          "published": published,
                          "summary": summary[:300] + ("…" if len(summary) > 300 else "")
                      })

              items.sort(key=lambda x: x.get("published") or "", reverse=True)
              return items

          sources = []
          for feed in FEEDS:
              try:
                  items = parse_feed(feed["url"])
                  print(f"Fetched {feed['name']}: {len(items)} items")
              except Exception as e:
                  print(f"Error fetching {feed['name']}: {e}")
                  items = []

              sources.append({
                  "id": feed["id"],
                  "name": feed["name"],
                  "count": len(items),
                  "items": items
              })

          output = {
              "updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "source": "Google Alerts",
              "sources": sources
          }

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          total = sum(s["count"] for s in sources)
          print(f"Generated news.json with {total} items across {len(sources)} sources")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update news.json from Google Alerts [skip ci]"
            git push
          fi
