<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Break Down</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #0b1224;
      --paddle: #e94560;
      --ball: #ffffff;
      --text: #eaeaea;
      --muted: #8892b0;
      --accent: #e94560;
      --brick1: #0f3460;
      --brick2: #533483;
      --brick3: #e94560;
      --brick4: #f5a623;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100dvh;
      padding: 0;
    }

    /* Top bar */
    .topbar {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 6px;
      flex-shrink: 0;
    }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 4px 0;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: var(--text);
    }

    .title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text);
    }

    .scores {
      display: flex;
      gap: 14px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .scores span {
      color: var(--text);
      font-weight: 600;
    }

    /* Canvas wrapper – scales to fit */
    .game-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 0 8px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: 100%;
      background: var(--surface);
      border-radius: 8px;
      touch-action: none;
    }

    /* Overlay screens */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(26, 26, 46, 0.88);
      border-radius: 8px;
      text-align: center;
      padding: 24px;
      z-index: 10;
    }
    .overlay.hidden {
      display: none;
    }
    .overlay h2 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }
    .overlay p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 6px;
    }
    .overlay .final-score {
      font-size: 1.15rem;
      color: var(--text);
      margin: 12px 0 20px;
    }
    .overlay .final-score span {
      color: var(--accent);
      font-weight: 700;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:active {
      transform: scale(0.97);
    }

    .hint {
      margin-top: 18px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Mobile controls */
    .controls {
      width: 100%;
      max-width: 480px;
      display: none;
      gap: 10px;
      padding: 10px 14px 18px;
      flex-shrink: 0;
    }
    .controls.visible {
      display: flex;
    }
    .ctrl-btn {
      flex: 1;
      height: 52px;
      background: var(--surface);
      border: 2px solid #2a2a4a;
      border-radius: 12px;
      color: var(--text);
      font-size: 1.4rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .ctrl-btn:active,
    .ctrl-btn.active {
      background: #2a2a4a;
    }
    .ctrl-btn.space {
      flex: 1.2;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    @media (max-width: 520px) {
      .scores {
        font-size: 0.75rem;
        gap: 10px;
      }
      .title {
        font-size: 0.95rem;
      }
    }
  
    #gameOverScreen { justify-content: flex-start; overflow-y: auto; padding: 20px; scrollbar-width: thin; scrollbar-color: #474477 #101426; scrollbar-gutter: stable; }
    /* Game-themed scrollbar for the results and leaderboard overlay */
    #gameOverScreen::-webkit-scrollbar { width: 9px; }
    #gameOverScreen::-webkit-scrollbar-track { background: #101426; border-radius: 999px; margin-block: 12px; }
    #gameOverScreen::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #303f70, #494179 55%, #5b477d); border: 2px solid #101426; border-radius: 999px; }
    #gameOverScreen::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #40558b, #5a5094 55%, #705a99); }
    #gameOverScreen::-webkit-scrollbar-corner { background: transparent; }
    .score-form { width: 100%; max-width: 320px; display: grid; gap: 10px; margin-bottom: 12px; }
    .score-form input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #8892b0; font: inherit; user-select: text; }
    .btn:disabled { opacity: .5; cursor: default; }
    #cloudStatus { font-size: .82rem; min-height: 20px; }
    .ranking { width: 100%; max-width: 340px; margin: 18px 0; }
    .ranking h3 { margin-bottom: 8px; }
    .ranking table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .ranking th, .ranking td { padding: 6px; text-align: left; border-bottom: 1px solid #2a2a4a; overflow-wrap: anywhere; }
    .ranking td:last-child { text-align: right; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back-link" href="index.html">← 回首頁</a>
    <div class="title">Break Down</div>
    <div class="scores">
      <div>分數 <span id="score">0</span></div>
      <div>最高 <span id="highScore">0</span></div>
    </div>
  </div>

  <div class="game-wrap">
    <canvas id="game" width="480" height="640"></canvas>

    <!-- Start overlay -->
    <div class="overlay" id="startScreen">
      <h2>Break Down</h2>
      <p>挑戰雙關卡，收集掉落道具！</p><p style="font-size:.8rem">道具：雙球、加命、加寬、緩速｜第二關有不可破壞障礙</p>
      <button class="btn" id="startBtn">開始遊戲</button>
      <p class="hint">電腦：← → 移動　空白鍵發射／暫停<br>手機：使用下方按鈕</p>
    </div>

    <!-- Game over overlay -->
    <div class="overlay hidden" id="gameOverScreen">
      <h2 id="endTitle">遊戲結束</h2>
      <p class="final-score">分數：<span id="finalScore">0</span></p>
      <form class="score-form" id="scoreForm">
        <label for="nickname">玩家暱稱（最多 20 字）</label>
        <input id="nickname" maxlength="20" autocomplete="nickname" required placeholder="輸入暱稱">
        <button class="btn" id="submitScore" type="submit">儲存成績</button>
      </form>
      <p id="cloudStatus" role="status" aria-live="polite"></p>
      <div class="ranking"><h3>雲端排行榜 · 前 10 名</h3>
        <table><thead><tr><th>名次</th><th>暱稱</th><th>分數</th></tr></thead><tbody id="rankRows"></tbody></table>
        <button id="refreshRanking" type="button" class="btn" style="margin-top:10px;padding:8px 16px">重新整理</button>
      </div>
      <button class="btn" id="restartBtn">重新開始</button>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="ctrl-btn" id="btnLeft" aria-label="向左">←</button>
    <button class="ctrl-btn space" id="btnSpace" aria-label="發射">發射</button>
    <button class="ctrl-btn" id="btnRight" aria-label="向右">→</button>
  </div>

  <script>
  (function () {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const endTitle = document.getElementById('endTitle');
    const finalScoreEl = document.getElementById('finalScore');
    const controls = document.getElementById('controls');

    const API_URL = 'https://script.google.com/macros/s/AKfycbyogHEMiF1tTfKWxgQYnjpsmkAp7369RaVLNdIObscP1KwjVKB93eeZbk3Tbv4pnn8z/exec';
    const cloudStatus = document.getElementById('cloudStatus');
    const submitScore = document.getElementById('submitScore');
    const nicknameInput = document.getElementById('nickname');
    const restartBtn = document.getElementById('restartBtn');
    let savedScore = null;
    let requestId = null;
    let submissionBusy = false;
    let submissionDone = false;
    let rankingVersion = 0;

    // Read-only JSONP avoids cross-origin response restrictions on GitHub Pages.
    function apiRead(params) {
      return new Promise((resolve, reject) => {
        const callback = 'ranking_' + crypto.randomUUID().replaceAll('-', '');
        const script = document.createElement('script');
        const timer = setTimeout(() => finish(new Error('連線逾時')), 15000);
        function finish(error, data) {
          clearTimeout(timer); script.remove(); delete window[callback];
          error ? reject(error) : resolve(data);
        }
        window[callback] = data => finish(null, data);
        script.onerror = () => finish(new Error('無法連線至排行榜'));
        script.src = API_URL + '?' + new URLSearchParams({...params, callback});
        document.head.appendChild(script);
      });
    }

    async function loadRanking() {
      const version = ++rankingVersion;
      const body = document.getElementById('rankRows');
      body.textContent = '';
      const loading = body.insertRow(); loading.insertCell().textContent = '載入中…';
      try {
        const data = await apiRead({action: 'top'});
        if (!data.ok || !Array.isArray(data.leaderboard)) throw new Error(data.error || '排行榜格式不正確');
        if (version !== rankingVersion) return;
        body.textContent = '';
        for (const entry of data.leaderboard.slice(0, 10)) {
          const row = body.insertRow();
          [entry.rank, entry.nickname, entry.score].forEach(value => row.insertCell().textContent = String(value));
        }
        if (!data.leaderboard.length) body.insertRow().insertCell().textContent = '尚無成績，成為第一位玩家！';
      } catch (error) {
        if (version !== rankingVersion) return;
        body.textContent = ''; body.insertRow().insertCell().textContent = '讀取失敗：' + error.message;
      }
    }

    document.getElementById('refreshRanking').addEventListener('click', loadRanking);
    document.getElementById('scoreForm').addEventListener('submit', async event => {
      event.preventDefault();
      if (submissionBusy || submissionDone || savedScore === null) return;
      const nickname = nicknameInput.value.normalize('NFKC').trim();
      if (!nickname || Array.from(nickname).length > 20 || /[\u0000-\u001f\u007f]/.test(nickname)) {
        cloudStatus.textContent = '請輸入 1～20 字的暱稱。'; return;
      }
      submissionBusy = true;
      submitScore.disabled = restartBtn.disabled = nicknameInput.disabled = true;
      cloudStatus.textContent = '正在儲存成績…';
      try {
        // Opaque POST responses cannot confirm saving; verify with a separate receipt.
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 20000);
        try {
          await fetch(API_URL, {method: 'POST', mode: 'no-cors', signal: controller.signal,
            headers: {'Content-Type': 'text/plain;charset=utf-8'},
            body: JSON.stringify({action: 'submit', nickname, score: savedScore, requestId})});
        } catch (_) {
          // The server may have accepted a request even if the browser timed out.
        } finally { clearTimeout(timer); }
        let confirmed = false;
        for (let attempt = 0; attempt < 5; attempt++) {
          try {
            const receipt = await apiRead({action: 'status', requestId});
            if (!receipt.ok) throw new Error(receipt.error || '確認失敗');
            if (receipt.saved) { confirmed = true; break; }
          } catch (error) { if (attempt === 4) throw error; }
          await new Promise(resolve => setTimeout(resolve, 1200));
        }
        if (!confirmed) throw new Error('尚未確認儲存，請確認後端已更新部署後重試');
        submissionDone = true;
        cloudStatus.textContent = '成績已儲存！同暱稱以最佳成績排名。';
        await loadRanking();
      } catch (error) {
        cloudStatus.textContent = error.message + '。可重試，同一筆提交不會重複寫入。';
      } finally {
        submissionBusy = false; restartBtn.disabled = false;
        submitScore.disabled = nicknameInput.disabled = submissionDone;
      }
    });

    // Detect touch device
    const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (isTouch) controls.classList.add('visible');

    // High score
    let highScore = parseInt(localStorage.getItem('breakDownHigh') || '0', 10);
    highScoreEl.textContent = highScore;

    // Game state and two-stage arcade mode
    let state = 'start', score = 0, lives = 3, level = 1;
    let animationId = null, lastFrameTime = null;
    const paddle = {w:80, h:12, x:200, y:H-40, speed:4.5};
    const BALL_START_SPEED = 4.0, BALL_SPEED_STEP = 0.12, BALL_MAX_SPEED = 9.0;
    let ballSpeed = BALL_START_SPEED;
    let balls = [], drops = [], bricks = [], obstacles = [];
    let wideUntil = 0, gameTime = 0, notice = '', noticeUntil = 0;
    const LEVEL_TIME_SECONDS = 180; // 每關 3 分鐘
    let timeRemaining = LEVEL_TIME_SECONDS, timerStarted = false;
    const BRICK_ROWS = 6, BRICK_COLS = 8, BRICK_W = 50, BRICK_H = 18, BRICK_PAD = 6;
    const BRICK_OFFSET_LEFT = (W - (BRICK_COLS * (BRICK_W + BRICK_PAD) - BRICK_PAD))/2;
    const brickColors = ['#3478d4','#7954c8','#e94583','#f5a623','#35b77a'];
    const keys = {left:false,right:false};
    function message(t) { notice=t; noticeUntil=gameTime+150; }
    function createBall(x,y,angle,launched=true) {
      return {x,y,r:8,dx:launched?ballSpeed*Math.sin(angle):0,
        dy:launched?-ballSpeed*Math.cos(angle):0,launched};
    }
    function resetBall() {
      balls=[createBall(paddle.x+paddle.w/2,paddle.y-10,0,false)];
    }
    function initBricks() {
      bricks=[]; obstacles=[]; drops=[];
      for(let r=0;r<BRICK_ROWS;r++) for(let c=0;c<BRICK_COLS;c++) {
        // Second stage uses staggered gaps and solid, indestructible barriers.
        if(level===2 && ((r===1 && (c===1 || c===6)) || (r===4 && (c===2 || c===5)))) continue;
        bricks.push({x:BRICK_OFFSET_LEFT+c*(BRICK_W+BRICK_PAD),y:56+r*(BRICK_H+BRICK_PAD),
          w:BRICK_W,h:BRICK_H,alive:true,color:brickColors[r%brickColors.length]});
      }
      if(level===2) obstacles=[
        {x:95,y:255,w:100,h:14},{x:285,y:255,w:100,h:14},
        {x:190,y:335,w:100,h:14}
      ];
    }
    function launchBall() {
      if(state!=='playing')return;
      for(const b of balls) if(!b.launched){
        const angle=Math.random()*.5-.25;
        b.dx=ballSpeed*Math.sin(angle); b.dy=-ballSpeed*Math.cos(angle); b.launched=true; timerStarted=true;
      }
    }
    function nextLevel() {
      if(level===2){endGame(true);return;}
      level=2; timeRemaining=LEVEL_TIME_SECONDS; timerStarted=false; ballSpeed=Math.min(BALL_MAX_SPEED,Math.max(ballSpeed,5));
      paddle.w=80; paddle.x=Math.min(W-paddle.w,paddle.x);
      wideUntil=0; initBricks(); resetBall(); message('第二關！小心不可破壞的障礙');
    }
    function resetGame() {
      savedScore=null; keys.left=keys.right=false; score=0; lives=3; level=1;
      gameTime=0; timeRemaining=LEVEL_TIME_SECONDS; timerStarted=false; ballSpeed=BALL_START_SPEED; paddle.w=80; paddle.x=W/2-40;
      wideUntil=0; notice=''; scoreEl.textContent=score;
      initBricks(); resetBall(); state='playing';
      startScreen.classList.add('hidden'); gameOverScreen.classList.add('hidden');
      if(animationId!==null)cancelAnimationFrame(animationId);
      animationId=null;lastFrameTime=null;loop();
    }
    function endGame(won) {
      state=won?'win':'over';
      if(score>highScore){highScore=score;localStorage.setItem('breakDownHigh',String(highScore));highScoreEl.textContent=highScore;}
      endTitle.textContent=won?'兩關全部通過！':(timeRemaining<=0?'時間到！':'遊戲結束');
      finalScoreEl.textContent=score;savedScore=score;requestId=crypto.randomUUID();submissionDone=false;
      submitScore.disabled=nicknameInput.disabled=false;
      cloudStatus.textContent='輸入暱稱，將本次成績加入雲端排行榜。';
      loadRanking();gameOverScreen.classList.remove('hidden');
      if(animationId!==null){cancelAnimationFrame(animationId);animationId=null;}
    }

    // Keyboard
    window.addEventListener('keydown', (e) => {
      if (e.target instanceof HTMLInputElement) return;
      if (e.key === 'ArrowLeft' || e.key === 'Left') {
        keys.left = true;
        e.preventDefault();
      } else if (e.key === 'ArrowRight' || e.key === 'Right') {
        keys.right = true;
        e.preventDefault();
      } else if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        if (state === 'playing') {
          if (balls.some(b => !b.launched)) launchBall();
          else {
            state = 'paused';
            if (animationId !== null) cancelAnimationFrame(animationId);
            animationId = null;
            draw();
          }
        } else if (state === 'paused') {
          state = 'playing';
          lastFrameTime = null;
      loop();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'Left') keys.left = false;
      else if (e.key === 'ArrowRight' || e.key === 'Right') keys.right = false;
    });

    // Touch buttons
    function bindHold(btn, onDown, onUp) {
      const start = (e) => { e.preventDefault(); onDown(); btn.classList.add('active'); };
      const end = (e) => { e.preventDefault(); onUp(); btn.classList.remove('active'); };
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('touchcancel', end, { passive: false });
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
    }

    bindHold(
      document.getElementById('btnLeft'),
      () => { keys.left = true; },
      () => { keys.left = false; }
    );
    bindHold(
      document.getElementById('btnRight'),
      () => { keys.right = true; },
      () => { keys.right = false; }
    );

    document.getElementById('btnSpace').addEventListener('click', (e) => {
      e.preventDefault();
      if (state === 'playing' && balls.some(b => !b.launched)) launchBall();
    });
    document.getElementById('btnSpace').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (state === 'playing' && balls.some(b => !b.launched)) launchBall();
    }, { passive: false });

    // Buttons
    document.getElementById('startBtn').addEventListener('click', resetGame);
    document.getElementById('restartBtn').addEventListener('click', resetGame);

    // Collision helpers
    function rectCircle(bx, by, br, rx, ry, rw, rh) {
      const closestX = Math.max(rx, Math.min(bx, rx + rw));
      const closestY = Math.max(ry, Math.min(by, ry + rh));
      const dx = bx - closestX;
      const dy = by - closestY;
      return dx * dx + dy * dy < br * br;
    }

    function bounceRect(b,rect,previousX,previousY) {
      if(!rectCircle(b.x,b.y,b.r,rect.x,rect.y,rect.w,rect.h))return false;
      if(previousY+b.r<=rect.y){b.y=rect.y-b.r-.1;b.dy=-Math.abs(b.dy);}
      else if(previousY-b.r>=rect.y+rect.h){b.y=rect.y+rect.h+b.r+.1;b.dy=Math.abs(b.dy);}
      else if(previousX<rect.x){b.x=rect.x-b.r-.1;b.dx=-Math.abs(b.dx);}
      else {b.x=rect.x+rect.w+b.r+.1;b.dx=Math.abs(b.dx);}
      return true;
    }
    function applyDrop(type) {
      if(type==='multi'){
        const originals=balls.filter(b=>b.launched);
        for(const b of originals.slice(0,3)) {
          if(balls.length>=5)break;
          const angle=Math.atan2(b.dx,-b.dy)+ (b.dx>=0?0.38:-0.38);
          balls.push(createBall(b.x,b.y,angle));
        }
        message('雙球道具！');
      }else if(type==='heart'){lives=Math.min(5,lives+1);message('生命 +1');}
      else if(type==='wide'){
        const center=paddle.x+paddle.w/2;paddle.w=120;
        paddle.x=Math.max(0,Math.min(W-paddle.w,center-paddle.w/2));
        wideUntil=gameTime+900;message('加寬擋板！');
      }else if(type==='slow'){
        ballSpeed=Math.max(BALL_START_SPEED,ballSpeed*.78);
        for(const b of balls) if(b.launched){const v=Math.hypot(b.dx,b.dy)||1;b.dx*=ballSpeed/v;b.dy*=ballSpeed/v;}
        message('球速降低！');
      }
    }
    function update(frameScale) {
      if(state!=='playing')return;
      gameTime+=frameScale;
      if(timerStarted){
        timeRemaining=Math.max(0,timeRemaining-frameScale/60);
        if(timeRemaining<=0){endGame(false);return;}
      }
      if(wideUntil && gameTime>wideUntil){const center=paddle.x+paddle.w/2;paddle.w=80;
        paddle.x=Math.max(0,Math.min(W-paddle.w,center-40));wideUntil=0;}
      if(keys.left)paddle.x-=paddle.speed*frameScale;
      if(keys.right)paddle.x+=paddle.speed*frameScale;
      paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
      for(const d of drops){
        d.y+=2.1*frameScale;
        if(d.y+12>=paddle.y && d.y-12<=paddle.y+paddle.h && d.x>=paddle.x-12 && d.x<=paddle.x+paddle.w+12){
          d.used=true;applyDrop(d.type);
        }
      }
      drops=drops.filter(d=>!d.used&&d.y<H+20);
      for(const b of balls){
        if(!b.launched){b.x=paddle.x+paddle.w/2;b.y=paddle.y-b.r-2;continue;}
        // Substeps prevent tunneling at high ball speeds.
        const steps=Math.max(1,Math.ceil(Math.hypot(b.dx,b.dy)*frameScale/5));
        for(let step=0;step<steps;step++){
          const px=b.x,py=b.y;
          b.x+=b.dx*frameScale/steps;b.y+=b.dy*frameScale/steps;
          if(b.x-b.r<0){b.x=b.r;b.dx=Math.abs(b.dx);}
          if(b.x+b.r>W){b.x=W-b.r;b.dx=-Math.abs(b.dx);}
          if(b.y-b.r<0){b.y=b.r;b.dy=Math.abs(b.dy);}
          if(b.y-b.r>H){b.dead=true;break;}
          if(b.dy>0 && rectCircle(b.x,b.y,b.r,paddle.x,paddle.y,paddle.w,paddle.h)){
            const hit=Math.max(-1,Math.min(1,(b.x-(paddle.x+paddle.w/2))/(paddle.w/2)));
            const angle=hit*Math.PI/3;
            b.dx=ballSpeed*Math.sin(angle);b.dy=-Math.abs(ballSpeed*Math.cos(angle));
            b.y=paddle.y-b.r-.1;
          }
          let collided=false;
          for(const o of obstacles)if(bounceRect(b,o,px,py)){collided=true;break;}
          if(collided)continue;
          for(const brick of bricks){
            if(!brick.alive)continue;
            if(bounceRect(b,brick,px,py)){
              brick.alive=false;score+=10;scoreEl.textContent=score;
              if(Math.random()<(level===1 ? .12 : .22)){
                const types=['multi','heart','wide','slow'];
                drops.push({x:brick.x+brick.w/2,y:brick.y+brick.h/2,type:types[Math.floor(Math.random()*types.length)]});
              }
              ballSpeed=Math.min(BALL_MAX_SPEED,ballSpeed+BALL_SPEED_STEP);
              for(const moving of balls)if(moving.launched){
                const v=Math.hypot(moving.dx,moving.dy)||1;
                moving.dx*=ballSpeed/v;moving.dy*=ballSpeed/v;
              }
              collided=true;break;
            }
          }
          if(collided)break;
        }
      }
      balls=balls.filter(b=>!b.dead);
      if(bricks.every(b=>!b.alive)){nextLevel();return;}
      if(!balls.length){lives--;if(lives<=0){endGame(false);return;}resetBall();message('失去一顆愛心');}
    }
    function roundedRect(x,y,w,h,r,color){
      ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
    }
    function drawHeart(x,y,size,color){
      ctx.fillStyle=color;ctx.beginPath();
      ctx.moveTo(x,y+size*.9);
      ctx.bezierCurveTo(x-size*.95,y+size*.35,x-size*.55,y-size*.25,x,y+size*.18);
      ctx.bezierCurveTo(x+size*.55,y-size*.25,x+size*.95,y+size*.35,x,y+size*.9);
      ctx.fill();
    }
    function draw(){
      ctx.fillStyle='#0b1224';ctx.fillRect(0,0,W,H);
      for(const b of bricks)if(b.alive)roundedRect(b.x,b.y,b.w,b.h,2,b.color);
      for(const o of obstacles){
        roundedRect(o.x,o.y,o.w,o.h,3,'#626b85');
        ctx.fillStyle='#9ca6bf';ctx.fillRect(o.x+5,o.y+3,o.w-10,2);
      }
      for(const d of drops){
        const colors={multi:'#3478d4',heart:'#e94583',wide:'#35b77a',slow:'#7954c8'};
        roundedRect(d.x-13,d.y-13,26,26,6,colors[d.type]);
        ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
        ctx.fillText(({multi:'×2',heart:'♥',wide:'↔',slow:'↓'})[d.type],d.x,d.y+5);
      }
      roundedRect(paddle.x,paddle.y,paddle.w,paddle.h,6,'#e94560');
      for(const b of balls){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();}
      ctx.font='bold 13px "Noto Sans TC",sans-serif';ctx.textAlign='left';ctx.fillStyle='#c9d1e7';
      ctx.fillText('第 '+level+' / 2 關',12,25);
      for(let i=0;i<Math.min(lives,5);i++)drawHeart(110+i*24,10,15,'#e94583');
      const remaining=Math.ceil(timeRemaining);
      const clock=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');
      ctx.textAlign='right';ctx.font='bold 15px sans-serif';
      ctx.fillStyle=timeRemaining<=30?'#ff758d':'#c9d1e7';
      ctx.fillText('◷ '+clock,W-14,25);
      if(gameTime<noticeUntil){ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillStyle='#e8edff';ctx.fillText(notice,W/2,435);}
      if(state==='paused'){
        ctx.fillStyle='rgba(11,18,36,.78)';ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 28px sans-serif';ctx.fillText('暫停',W/2,H/2);
        ctx.font='14px sans-serif';ctx.fillText('按空白鍵繼續',W/2,H/2+28);
      }
    }

    function loop(timestamp) {
      animationId = null;
      const frameScale = lastFrameTime === null || timestamp === undefined
        ? 0 : Math.min((timestamp - lastFrameTime) / (1000 / 60), 2);
      if (timestamp !== undefined) lastFrameTime = timestamp;
      update(frameScale);
      draw();
      if (state === 'playing') {
        animationId = requestAnimationFrame(loop);
      }
    }

    // Initial draw for start screen
    initBricks();
    draw();
  })();
  </script>
